<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonders Companion</title>
<meta name="description" content="Scoreblok, wetenschapshulp, veldslagteller en spelregels voor 7 Wonders (2020).">
<meta name="theme-color" content="#1b1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wonders">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#1b1712; --bg2:#241f18; --card:#2c261d; --line:#3d3528; --text:#f3ead8; --muted:#b4a68b; --accent:#e3b04b; --accent-ink:#1b1712;
  --mil:#d9534a; --coin:#e8c040; --wonder:#b08f62; --civ:#4b8ee0; --com:#e8902f; --guild:#a466d6; --sci:#47b26b; --leaders:#e9e4da; --cities:#6c6c6c; --debt:#9a3b34;
  --win:#47b26b; --lose:#d9534a; --tie:#8a7f6a;
  --radius:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  --bg:#f5efe2; --bg2:#ece3d0; --card:#fffaf0; --line:#dccfb4; --text:#2a2318; --muted:#7a6c52; --accent:#a8741a; --accent-ink:#fffaf0;
  --cities:#555; --leaders:#9b927f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding-bottom:calc(72px + var(--safe-b))}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:19px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.5px;flex:1}
header.top .sub{font-size:12px;color:var(--muted);font-family:system-ui}
main{padding:14px 16px 24px;max-width:860px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--lose)}
.icon-btn{background:none;border:0;padding:6px;cursor:pointer;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* Score pad */
.podium{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.podium .p{flex:0 0 auto;min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.podium .p.lead{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.podium .rank{font-size:12px;color:var(--muted)}
.podium .tot{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.podium .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pad-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.pad{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.pad th,table.pad td{padding:0;border-bottom:1px solid var(--line);text-align:center}
table.pad thead th{font-size:13px;padding:8px 4px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.pad thead th .w{display:block;font-size:11px;color:var(--muted);font-weight:400}
table.pad th.cat{white-space:nowrap;position:sticky;left:0;background:var(--card);text-align:left;padding:0 8px;min-width:96px;font-size:13px;font-weight:600;z-index:1}
table.pad th.cat .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.pad td button{width:100%;min-width:52px;height:44px;background:none;border:0;font-size:17px;cursor:pointer}
table.pad td button.zero{color:var(--muted);opacity:.55}
table.pad tr.total td,table.pad tr.total th{border-bottom:0;font-weight:800;font-size:19px;padding:10px 4px;background:var(--bg2)}
table.pad tr.total th.cat{background:var(--bg2)}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 12px}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--safe-b));border-top:1px solid var(--line)}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .hd h2{font-size:18px;flex:1}
.big-out{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.out-row{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}
.field{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .lbl{flex:1;min-width:0}
.field .lbl b{display:block;font-size:15px}
.field .lbl span{display:block;font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex:0 0 auto}
.step button{width:40px;height:40px;border:0;background:none;font-size:20px;cursor:pointer}
.step input{width:46px;height:40px;border:0;background:none;text-align:center;font-size:17px;font-weight:700;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=text],select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--accent)}
/* Science */
.sym{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--sci);color:#fff;flex:0 0 auto}
.sym svg{width:20px;height:20px}
.advice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.advice div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.advice div.best{border-color:var(--sci);box-shadow:0 0 0 1px var(--sci) inset}
.advice b{display:block;font-size:20px}
table.mini{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
table.mini th{color:var(--muted);font-weight:600}
table.mini td:first-child,table.mini th:first-child{text-align:left}
/* War */
.war-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.war-row:last-child{border-bottom:0}
.vs{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tok{font-size:12px;border-radius:6px;padding:2px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.tok.w{background:color-mix(in srgb,var(--win) 25%,transparent);color:var(--win)}
.tok.l{background:color-mix(in srgb,var(--lose) 25%,transparent);color:var(--lose)}
.tok.t{background:color-mix(in srgb,var(--tie) 25%,transparent);color:var(--muted)}
.age-badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;color:#fff}
.a1{background:#8a5a2b}.a2{background:#5b6f87}.a3{background:#7a4a8f}
/* Guide */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
details summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:20px}
details[open] summary::after{content:"–"}
details .body{padding:0 14px 14px}
details .body p,details .body li{font-size:15px}
details .body ul{padding-left:20px;margin:6px 0}
.gstep{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.gstep:last-child{border-bottom:0}
.gstep p,.gstep ul{margin:4px 0 0}
.gnum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
details .body ol{padding-left:20px;margin:6px 0}
details .body li{margin-bottom:4px}
.wonder h3{font-family:Georgia,serif;font-size:18px}
.stage{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stage:last-child{border-bottom:0}
.stage .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--wonder);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-right:4px}
.empty{text-align:center;padding:30px 10px}
.empty .seal{width:84px;height:84px;margin:0 auto 12px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist-item:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.flow{background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.flow-steps{display:flex;gap:4px;margin-bottom:10px}
.flow-steps span{flex:1;text-align:center;font-size:11px;font-weight:700;padding:5px 2px;border-radius:6px;background:var(--bg2);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-steps span.done{background:color-mix(in srgb,var(--win) 25%,transparent);color:var(--win)}
.flow-steps span.now{background:var(--accent);color:var(--accent-ink)}
.flow-title{font-weight:800;font-size:16px;margin-bottom:2px}
.flow-text{font-size:14px;margin:0 0 10px}
.cardchip{display:inline-flex;align-items:center;gap:6px;text-align:left}
.cardchip[disabled]{opacity:1;cursor:default}
.cardchip .cx{font-size:12px;opacity:.75}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.cdot.big{width:14px;height:14px;border-radius:4px}
.best-card{border-color:var(--win);box-shadow:0 0 0 1px var(--win) inset}
.rec{font-size:19px;margin-top:2px}
.cardrow ul{margin:6px 0 8px;padding-left:18px}
.cardrow.top{border-color:var(--win)}
.cardrow.dim{opacity:.6}
.cardrow .val{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 2px 8px;font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="grow"><h1>Wonders Companion</h1><div class="sub" id="subtitle">Scoreblok</div></div>
  <button class="icon-btn" id="themeBtn" aria-label="Thema wisselen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<main>
  <section class="view on" id="v-score"></section>
  <section class="view" id="v-pick"></section>
  <section class="view" id="v-war"></section>
  <section class="view" id="v-wonders"></section>
  <section class="view" id="v-guide"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="score" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Score</span></button>
  <button data-tab="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="10" height="14" rx="2" transform="rotate(-10 8 13)"/><rect x="11" y="4" width="10" height="14" rx="2" transform="rotate(8 16 11)"/></svg><span>Kiezen</span></button>
  <button data-tab="war"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg><span>Oorlog</span></button>
  <button data-tab="wonders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 20h18z"/><path d="M8 20l4-8 4 8"/></svg><span>Wonders</span></button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg><span>Gids</span></button>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* 7 Wonders (2020, Nederlandstalige editie) — hulp-app. Alle gegevens nagekeken met de eigen doos. */

/* ============ OPSLAG ============ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('7wc.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('7wc.'+k, JSON.stringify(v)); }catch(e){} },
};
const PT = n => `${n} ${n===1?'punt':'punten'}`;

/* ============ GEGEVENS ============ */
const CATS = [
  // Volgorde en kleuren zoals het scoreblok in de spelregels (p. 8)
  {k:'wonder', n:'Wonder', c:'var(--wonder)'},
  {k:'coin', n:'Munten', c:'var(--coin)'},
  {k:'mil', n:'Militair', c:'var(--mil)'},
  {k:'civ', n:'Blauw', c:'var(--civ)'},
  {k:'com', n:'Geel', c:'var(--com)'},
  {k:'sci', n:'Groen', c:'var(--sci)'},
  {k:'guild', n:'Paars', c:'var(--guild)'},
];
const RES = {ore:'Erts', glass:'Glas', papyrus:'Papyrus', clay:'Klei', wood:'Hout', loom:'Stof', stone:'Steen'};
// Wonderborden. vp = punten van die fase. 'A' = Dag, 'B' = Nacht. Nagekeken met de eigen borden.
const E = {
  raw:'Elke beurt 1 bruine grondstof naar keuze',
  grey:'Elke beurt 1 grijze grondstof naar keuze',
  sci:'1 wetenschapssymbool naar keuze (joker)',
};
const WONDERS = {
  rhodes:{n:'Rhódos', full:'De Kolossus van Rhódos', res:'ore',
    A:[{vp:3},{vp:0,t:'2 schilden'},{vp:7}],
    B:[{vp:3,t:'1 schild, 3 munten, 3 punten'},{vp:4,t:'1 schild, 4 munten, 4 punten'}],
    tips:['Het militaire wonder: de schilden op je bord zijn “gratis” rode kaarten.','Investeer niet te veel in rood: winnen met 1 schild levert evenveel op als met 10.','Nacht is snel (2 fases) en geeft munten.']},
  alexandria:{n:'Alexandria', full:'De Vuurtoren van Alexandria', res:'glass',
    A:[{vp:3},{vp:0,t:E.raw},{vp:7}],
    B:[{vp:0,t:E.raw},{vp:0,t:E.grey},{vp:7}],
    tips:['Je wonder levert grondstoffen, dus je kunt veel bruine en grijze kaarten overslaan.','Bouw de grondstof-fases vroeg: ze helpen je elke beurt.','Je verkoopt weinig aan je buren, dus let op je munten.']},
  ephesus:{n:'Éphesos', full:'De Tempel van Artemis in Éphesos', res:'papyrus',
    A:[{vp:3},{vp:0,t:'9 munten'},{vp:7}],
    B:[{vp:2,t:'4 munten, 2 punten'},{vp:3,t:'4 munten, 3 punten'},{vp:5,t:'4 munten, 5 punten'}],
    tips:['Met je munten koop je wat je mist bij je buren.','Bouw je wonder vroeg zodat je munten voor je werken.','Overgebleven munten zijn op het einde nog 1 punt per 3 waard.']},
  babylon:{n:'Babylon', full:'De Hangende Tuinen van Babylon', res:'wood',
    A:[{vp:3},{vp:0,t:E.sci},{vp:7}],
    B:[{vp:0,t:'Je mag de laatste kaart van elk tijdperk ook spelen'},{vp:0,t:E.sci}],
    tips:['Het wetenschapswonder: de joker is laat in het spel vaak 10+ punten waard.','Groene kaarten vormen veel ketens: begin er vroeg mee.','Nacht: bouw fase 1 zo vroeg mogelijk, dan speel je elk tijdperk een extra kaart.']},
  olympia:{n:'Olympía', full:'Het Beeld van Zeus in Olympía', res:'clay',
    A:[{vp:3},{vp:0,t:'De eerste kaart van elke kleur bouw je gratis'},{vp:7}],
    B:[{vp:2,t:'De eerste kaart van elk tijdperk is gratis + 2 punten'},{vp:3,t:'De laatste kaart van elk tijdperk is gratis + 3 punten'},{vp:5}],
    tips:['Bouw fase 2 zo vroeg mogelijk: gratis bouwen is waar dit wonder om draait.','Dag: gebruik de gratis kaart voor dure kaarten, bv. je eerste gilde.','Gratis bouwen geldt alleen voor kaarten, niet voor wonderfases.']},
  halicarnassus:{n:'Halikarnassos', full:'Het Mausoleum van Halikarnassos', res:'loom',
    A:[{vp:3},{vp:0,t:'Bouw gratis 1 kaart uit de aflegstapel'},{vp:7}],
    B:[{vp:2,t:'Bouw gratis 1 kaart uit de aflegstapel + 2 punten'},{vp:1,t:'Bouw gratis 1 kaart uit de aflegstapel + 1 punt'},{vp:0,t:'Bouw gratis 1 kaart uit de aflegstapel'}],
    tips:['Bouw deze fase op het einde van een tijdperk: dan ligt er het meest op de aflegstapel.','Sterke kaarten (gilden, groen) belanden vaak op de aflegstapel.','Nacht geeft drie gratis kaarten.']},
  giza:{n:'Gizah', full:'De Piramides van Gizah', res:'stone',
    A:[{vp:3},{vp:5},{vp:7}],
    B:[{vp:3},{vp:5},{vp:5},{vp:7}],
    tips:['Pure punten: 15 (Dag) of 20 (Nacht). Ideaal voor je eerste spel.','Bouw een fase als je hand zwak is.','Een fase bouwen “begraaft” ook een kaart die je buur wil.']},
};
// Namen zoals op de Nederlandstalige kaarten (2020).
const GUILDS = [
  {k:'workers', n:'Arbeidersgilde', m:1, of:'bruine kaarten van je buren'},
  {k:'craftsmen', n:'Ambachtsgilde', m:2, of:'grijze kaarten van je buren'},
  {k:'magistrates', n:'Magistratengilde', m:1, of:'blauwe kaarten van je buren'},
  {k:'traders', n:'Handelarengilde', m:1, of:'gele kaarten van je buren'},
  {k:'spies', n:'Spionnengilde', m:1, of:'rode kaarten van je buren'},
  {k:'philosophers', n:'Filosofengilde', m:1, of:'groene kaarten van je buren'},
  {k:'builders', n:'Bouwersgilde', m:1, of:'wonderfases van jou + je buren'},
  {k:'shipowners', n:'Redersgilde', m:1, of:'je eigen bruine + grijze + paarse kaarten'},
  {k:'decorators', n:'Ontwerpersgilde', m:7, of:'vul 1 in als je hele wonder af is'},
];
const COMMERCE = [
  {k:'haven', n:'Haven', m:1, of:'je bruine kaarten'},
  {k:'lighthouse', n:'Vuurtoren', m:1, of:'je gele kaarten (deze meegeteld)'},
  {k:'chamber', n:'Kamer van Koophandel', m:2, of:'je grijze kaarten'},
  {k:'ludus', n:'Training voor gladiatoren', m:1, of:'je rode kaarten'},
  {k:'arena', n:'Arena', m:1, of:'je gebouwde wonderfases'},
];
const SIDE = s => s==='A' ? 'Dag' : 'Nacht';
const stageText = s => s.t || PT(s.vp);
const MIL_VP = [1,3,5];
const AGE = ['I','II','III'];
const SYM = {

function newPlayer(name){ return {name, wonder:'', side:'A', d:{coins:3, sci:{t:0,c:0,g:0,w:0}, mil:{p1:0,p3:0,p5:0,m1:0}, stages:[], guild:{}, com:{}, man:{}}}; }
function newGame(players){ return {id:Date.now(), date:new Date().toISOString(), players, war:[null,null,null]}; }

/* ============ PUNTEN ============ */
function sciScore(s){
  const t=+s.t||0, c=+s.c||0, g=+s.g||0, w=Math.max(0,+s.w||0);
  let best={vp:-1, a:[t,c,g], add:[0,0,0]};
  for(let i=0;i<=w;i++) for(let j=0;j<=w-i;j++){
    const k=w-i-j, a=[t+i,c+j,g+k];
    const vp=a[0]*a[0]+a[1]*a[1]+a[2]*a[2]+7*Math.min(...a);
    if(vp>best.vp) best={vp, a, add:[i,j,k]};
  }
  return best;
}
function neighbors(n,i){ return [(i-1+n)%n, (i+1)%n]; }
function warTokens(g){
  const n=g.players.length, res=g.players.map(()=>({p1:0,p3:0,p5:0,m1:0,vp:0}));
  g.war.forEach((sh,age)=>{
    if(!sh) return;
    for(let i=0;i<n;i++) for(const j of neighbors(n,i)){
      if(sh[i]>sh[j]){ res[i]['p'+MIL_VP[age]]++; res[i].vp+=MIL_VP[age]; }
      else if(sh[i]<sh[j]){ res[i].m1++; res[i].vp--; }
    }
  });
  return res;
}
function catScore(g, pi, k, war){
  const p=g.players[pi], d=p.d, man=+d.man[k]||0;
  switch(k){
    case 'coin': return Math.floor((+d.coins||0)/3)+man;
    case 'sci': return sciScore(d.sci).vp+man;
    case 'mil': { const m=d.mil; return (war||warTokens(g))[pi].vp + m.p1+3*m.p3+5*m.p5-m.m1 + man; }
    case 'wonder': { let v=man; if(p.wonder&&WONDERS[p.wonder]){ const st=WONDERS[p.wonder][p.side]; (d.stages||[]).forEach((b,i)=>{ if(b&&st[i]) v+=st[i].vp; }); } return v; }
    case 'guild': return GUILDS.reduce((s,x)=>s+(+d.guild[x.k]||0)*x.m,0)+man;
    case 'com': return COMMERCE.reduce((s,x)=>s+(+d.com[x.k]||0)*x.m,0)+man;
    default: return man;
  }
}
function totals(g){
  const war=warTokens(g);
  return g.players.map((p,i)=>{
    const by={}; let tot=0;
    CATS.forEach(c=>{ by[c.k]=catScore(g,i,c.k,war); tot+=by[c.k]; });
    return {i, name:p.name, tot, by, coins:+p.d.coins||0};
  });
}
function ranking(g){
  const rk=totals(g).sort((a,b)=> b.tot-a.tot || b.coins-a.coins);
  // Gelijk aantal punten én munten = gedeelde plaats
  rk.forEach(r=>{ r.rank=1+rk.filter(o=>o.tot>r.tot||(o.tot===r.tot&&o.coins>r.coins)).length; });
  return rk;
}
const winnersOf = results => results.filter((r,ix)=> r.rank ? r.rank===1 : ix===0);

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function setPath(o,p,v){ const ks=p.split('.'); const last=ks.pop(); const t=ks.reduce((a,k)=>(a[k]??=( {} )),o); t[last]=v; }
function stepper(path, val, min=0){ return `<div class="step" data-path="${path}" data-min="${min}"><button type="button" data-d="-1" aria-label="min">−</button><input type="number" inputmode="numeric" value="${val||0}" min="${min}"><button type="button" data-d="1" aria-label="plus">+</button></div>`; }
function symIcon(k){ return `<span class="sym" title="${SYM[k].n}" ${k==='w'?'style="background:var(--accent);color:var(--accent-ink)"':''}>${SYM[k].svg}</span>`; }
const dateFmt = d => new Date(d).toLocaleDateString('nl-BE');
const defaultName = i => 'Speler '+i;
const isDefaultName = n => /^(Player|Speler) \d+$/.test(n);

let sheetCtx=null;
function openSheet(title, html, ctx){

  $('#scrim').classList.add('on');

}
function closeSheet(){ $('#scrim').classList.remove('on'); sheetCtx=null; save(); renderAll(); }
$('#scrim').addEventListener('click', e=>{ if(e.target.id==='scrim' || e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('click', e=>{
  const b=e.target.closest('.step button'); if(!b) return;
  const st=b.closest('.step'), inp=st.querySelector('input'), min=+st.dataset.min;
  inp.value=Math.max(min,(+inp.value||0)+(+b.dataset.d)); inp.dispatchEvent(new Event('input',{bubbles:true}));
});
document.addEventListener('input', e=>{
  const st=e.target.closest('.step'); if(!st) return;
  const root = st.closest('#sheet') ? sheetCtx?.obj : st.closest('[data-obj]') ? OBJS[st.closest('[data-obj]').dataset.obj]() : null;
  if(!root) return;
  let v=parseInt(e.target.value,10); if(isNaN(v)) v=0;
  setPath(root, st.dataset.path, v);
  save();
  if(st.closest('#sheet')) sheetCtx.update?.(); else (st.closest('[data-obj]')._upd||(()=>{}))();
});
document.addEventListener('focusin', e=>{ if(e.target.matches('.step input')) e.target.select(); });
const OBJS = { sci:()=>sciCalc, war:()=>game, pick:()=>game };

/* ============ SPELVERLOOP ============ */
// Fase: 0 = klaarzetten, 1..3 = tijdperk I..III bezig, 4 = eindtelling
function phase(){
  if(!game) return 0;
  let done=0; while(done<3 && game.war[done]) done++;
  return done+1;
}
const FLOW_STEPS=['Start','Tijdperk I','Tijdperk II','Tijdperk III','Eindscore'];
function flowBar(where){
  const ph=phase();
  let title, text, btns;
  if(ph===0){
    title='Stap 1 · Klaarzetten';
    text='Lees in de <b>Gids</b> hoe je klaarzet. Start daarna een spel en geef de spelers in volgens de zitvolgorde (met de klok mee).';
    btns=`<button class="btn" data-flow="guide">📖 Gids</button><button class="btn primary grow" data-flow="new">Nieuw spel</button>`;
  } else if(ph<4){
    const a=AGE[ph-1], dir=ph===2?'naar rechts →':'← naar links';
    title=`Tijdperk ${a} · speel 6 beurten`;
    text=`Kies een kaart, speel ze, geef de rest door <b>${dir}</b>. Na de 6e beurt: tel de schilden in <b>Oorlog</b>.<br><span class="muted small">Twijfel je welke kaart je legt? Kijk in <b>Kiezen</b>.</span>`;
    btns = where==='war' ? '' : where==='pick' ? `<button class="btn grow" data-flow="war">⚔️ Na 6 beurten: veldslag tijdperk ${a}</button>` : `<button class="btn" data-flow="pick">🃏 Kiezen</button><button class="btn primary grow" data-flow="war">⚔️ Veldslag tijdperk ${a}</button>`;
  } else {
    title='Eindscore · tel de punten';
    text='Alle veldslagen zijn genoteerd. Tik in <b>Score</b> op elk vakje en vul in wat iedereen heeft. Tik daarna op <b>Afronden & bewaren</b>.';
    btns = where==='score' ? `<button class="btn primary grow" data-flow="fill">Score invullen</button>` : `<button class="btn primary grow" data-flow="score">🏆 Naar Score</button>`;
  }
  return `<div class="flow"><div class="flow-steps">${FLOW_STEPS.map((n,i)=>`<span class="${i<ph?'done':i===ph?'now':''}">${i<ph?'✓ ':''}${n}</span>`).join('')}</div>
    <div class="flow-title">${title}</div><p class="flow-text">${text}</p>${btns?`<div class="row">${btns}</div>`:''}</div>`;
}
document.addEventListener('click', e=>{
  const f=e.target.closest('[data-flow]'); if(!f) return;
  const a=f.dataset.flow;
  if(a==='new') setupSheet();
  else if(a==='fill'){ const first=CATS[0].k; editCat(0, first); }
  else show(a);
});

/* ============ SCORE ============ */
function renderScore(){
  const v=$('#v-score');
  if(!game){
    v.innerHTML=`${flowBar('score')}<div class="card empty">
      <svg class="seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M50 18 22 78h56z" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M36 78l14-30 14 30" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>
      <h2 style="font-family:Georgia,serif">Klaar om een wereldwonder te bouwen?</h2>
      <p class="muted" style="margin-bottom:0">Het scoreblok en de veldslagteller verschijnen zodra je een spel start.</p></div>
      ${renderHistory()}`;
    return;
  }
  const rk=ranking(game), byI=Object.fromEntries(rk.map(r=>[r.i,r]));
  v.innerHTML=`
    ${flowBar('score')}
    ${phase()<4?'':`<div class="podium">${rk.map(r=>`<div class="p ${r.rank===1&&r.tot>0?'lead':''}"><div class="rank">${r.rank===1&&r.tot>0?'👑 ':''}${r.rank}e</div><div class="tot">${r.tot}</div><div class="nm">${esc(r.name)}</div></div>`).join('')}</div>`}
    <div class="pad-wrap"><table class="pad">
      <thead><tr><th class="cat"></th>${game.players.map(p=>`<th><button class="icon-btn" style="color:inherit;padding:0;font-weight:600" data-act="players">${esc(p.name)}</button><span class="w">${WONDERS[p.wonder]?WONDERS[p.wonder].n+' '+SIDE(p.side):'&nbsp;'}</span></th>`).join('')}</tr></thead>
      <tbody>
      ${CATS.map(c=>`<tr><th class="cat"><span class="sw" style="background:${c.c}"></span>${c.n}</th>${game.players.map((p,i)=>{const s=byI[i].by[c.k];return `<td><button data-cell="${i}:${c.k}" class="${s===0?'zero':''}">${s}</button></td>`}).join('')}</tr>`).join('')}
      <tr class="total"><th class="cat">Totaal</th>${game.players.map((p,i)=>`<td>${byI[i].tot}</td>`).join('')}</tr>
      </tbody></table></div>
    <p class="hint">Tik op een vakje om te scoren. De app rekent voor je: munten → punten, wetenschap, gilden, wonderfases. Bij gelijkstand wint wie de meeste munten heeft; is het dan nog gelijk, dan delen jullie de winst.</p>
    <div class="row wrap">
      <button class="btn" data-act="players">Spelers & wonders</button>
      <button class="btn primary grow" data-act="finish">Afronden & bewaren</button>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn ghost small danger" data-act="discard">Spel verwijderen</button></div>
    ${renderHistory()}`;
}
function renderHistory(){
  if(!history.length) return '';
  const wins={};
  history.forEach(h=>{ winnersOf(h.results).forEach(w=>{ wins[w.name]=(wins[w.name]||0)+1; }); });
  const top=Object.entries(wins).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="sec-title">Geschiedenis</div>
  <div class="card"><div class="small muted" style="margin-bottom:6px">Overwinningen: ${top.map(([n,c])=>`<b style="color:var(--text)">${esc(n)}</b> ${c}`).join(' · ')}</div>
  ${history.slice(0,15).map((h,ix)=>`<div class="hist-item"><div class="grow"><b>${winnersOf(h.results).map(w=>esc(w.name)).join(' & ')}</b> ${winnersOf(h.results).length>1?'delen de winst met':'won met'} ${h.results[0].tot}<div class="small muted">${dateFmt(h.date)} · ${h.results.map(r=>esc(r.name)+' '+r.tot).join(', ')}</div></div><button class="icon-btn" data-hdel="${ix}" aria-label="Verwijderen">✕</button></div>`).join('')}</div>`;
}
$('#v-score').addEventListener('click', e=>{
  const cell=e.target.closest('[data-cell]');
  if(cell){ const [i,k]=cell.dataset.cell.split(':'); editCat(+i,k); return; }
  const hd=e.target.closest('[data-hdel]');
  if(hd){ if(confirm('Dit spel uit de geschiedenis verwijderen?')){ history.splice(+hd.dataset.hdel,1); save(); renderScore(); } return; }
  const a=e.target.closest('[data-act]')?.dataset.act;
  if(a==='new') setupSheet();
  if(a==='players') setupSheet(true);
  if(a==='discard' && confirm('Het huidige spel verwijderen?')){ game=null; save(); renderAll(); }
  if(a==='finish'){
    const rk=ranking(game);
    if(rk.every(r=>r.tot===0)){ toast('Vul eerst scores in'); return; }
    history.unshift({date:game.date, results:rk.map(r=>({name:r.name, tot:r.tot, rank:r.rank, wonder:game.players[r.i].wonder}))});
    const w=rk.filter(r=>r.rank===1).map(r=>r.name); game=null; save(); renderAll(); toast(w.length>1?`🏆 Gedeelde overwinning: ${w.join(' & ')}!`:`🏆 ${w[0]} wint! Bewaard in de geschiedenis.`);
  }
});

function editCat(pi,k){
  const p=game.players[pi], d=p.d, c=CATS.find(x=>x.k===k);
  const title=`<span style="color:${c.c}">●</span> ${esc(p.name)} · ${c.n}`;
  const out=`<div class="out-row"><div class="big-out" id="o-vp">0</div><div class="muted">punten</div><div class="grow small muted" id="o-note" style="text-align:right"></div></div>`;
  const manual=(lbl,sub)=>`<div class="field"><div class="lbl"><b>${lbl}</b>${sub?`<span>${sub}</span>`:''}</div>${stepper('man.'+k, d.man[k])}</div>`;
  let body='', upd=()=>{};
  const base=()=>{ $('#o-vp').textContent=catScore(game,pi,k); };
  if(k==='coin'){
    body=`${out}<div class="card"><div class="field"><div class="lbl"><b>Munten in de schatkist</b><span>1 punt per 3 munten. Munten beslissen ook bij gelijkstand.</span></div>${stepper('coins', d.coins)}</div></div>`;
    upd=()=>{ base(); const r=d.coins%3, m=3-r; $('#o-note').textContent= r? `Nog ${m} munt${m>1?'en':''} voor +1 punt`:''; };
  } else if(k==='sci'){
    body=`${out}<div class="card">${['t','c','g','w'].map(s=>`<div class="field">${symIcon(s)}<div class="lbl"><b>${SYM[s].pl}</b>${s==='w'?'<span>Wetenschappersgilde, Babylon</span>':''}</div>${stepper('sci.'+s, d.sci[s])}</div>`).join('')}</div>
      <div class="card"><b>Volgend symbool waard</b><div class="advice" id="o-adv"></div><div class="small muted" id="o-wild" style="margin-top:8px"></div></div>`;
    upd=()=>{ base(); sciAdvice(d.sci,'#o-adv','#o-wild','#o-note'); };
  } else if(k==='mil'){
    const wt=warTokens(game)[pi], any=game.war.some(Boolean);
    body=`${out}<div class="card small">${any?`Uit het tabblad Oorlog: <b>${wt.vp>=0?'+':''}${wt.vp} punten</b> (${wt.p1}× +1, ${wt.p3}× +3, ${wt.p5}× +5, ${wt.m1}× −1)`:'Tip: gebruik het tabblad <b>Oorlog</b> op het einde van elk tijdperk, dan wordt dit automatisch ingevuld.'}</div>
      <div class="card"><div class="small muted" style="margin-bottom:4px">${any?'Extra fiches (niet via het tabblad Oorlog)':'Militaire fiches'}</div>
      <div class="field"><div class="lbl"><b>+1-fiches</b><span>Gewonnen in tijdperk I</span></div>${stepper('mil.p1', d.mil.p1)}</div>
      <div class="field"><div class="lbl"><b>+3-fiches</b><span>Gewonnen in tijdperk II</span></div>${stepper('mil.p3', d.mil.p3)}</div>
      <div class="field"><div class="lbl"><b>+5-fiches</b><span>Gewonnen in tijdperk III</span></div>${stepper('mil.p5', d.mil.p5)}</div>
      <div class="field"><div class="lbl"><b>−1-fiches</b><span>Verloren veldslagen</span></div>${stepper('mil.m1', d.mil.m1)}</div></div>`;
    upd=base;
  } else if(k==='wonder'){
    if(WONDERS[p.wonder]){
      const Wd=WONDERS[p.wonder], st=Wd[p.side];
      body=`${out}<div class="card"><div class="small muted">${Wd.full} · ${SIDE(p.side)}</div>${st.map((s,i)=>`<label class="check"><input type="checkbox" data-stage="${i}" ${d.stages[i]?'checked':''}><div class="grow"><b>Fase ${i+1}</b> <span class="small muted">${stageText(s)}</span></div><b>${s.vp?'+'+s.vp:''}</b></label>`).join('')}</div>`;
    } else body=`${out}<div class="card">${manual('Wonderpunten','Som van de punten op je gebouwde fases')}<p class="small muted">Kies het wonder van deze speler bij <b>Spelers & wonders</b>, dan vink je gewoon de gebouwde fases aan.</p></div>`;
    upd=base;
  } else if(k==='guild'||k==='com'){
    const list=k==='guild'?GUILDS:COMMERCE, key=k==='guild'?'guild':'com';
    body=`${out}<div class="card"><div class="small muted" style="margin-bottom:4px">${k==='guild'?'Vul voor elke gilde die je hebt het aantal in waarop ze scoort.':'Gele kaarten uit tijdperk III die punten geven. Vul het aantal in voor elke kaart die je hebt.'}</div>
      ${list.map(x=>`<div class="field"><div class="lbl"><b>${x.n} <span style="display:inline;color:var(--muted);font-weight:400">${PT(x.m)} per stuk</span></b><span>${x.of}</span></div>${stepper(key+'.'+x.k, d[key][x.k])}</div>`).join('')}
      ${k==='guild'?'<div class="field"><div class="lbl"><b>Wetenschappersgilde</b><span>Geeft zelf geen punten: tel +1 joker bij Wetenschap.</span></div></div>':''}</div>`;
    upd=base;
  } else {
    body=`${out}<div class="card">${manual('Punten','Tel de punten op je blauwe kaarten op.')}</div>`;
    upd=base;
  }
  const ks=CATS.map(x=>x.k), ci=ks.indexOf(k), prev=ks[(ci-1+ks.length)%ks.length], nextP=(pi+1)%game.players.length;
  body+=`<div class="row"><button class="btn grow" data-nav="${pi}:${prev}">‹ ${CATS.find(x=>x.k===prev).n}</button><button class="btn grow" data-nav="${nextP}:${k}">${esc(game.players[nextP].name)} ›</button></div>`;
  openSheet(title, body, {obj:d, update:upd});
}
$('#sheet').addEventListener('change', e=>{
  const s=e.target.closest('[data-stage]'); if(!s||!sheetCtx) return;
  sheetCtx.obj.stages[+s.dataset.stage]=s.checked; save(); sheetCtx.update();
});
$('#sheet').addEventListener('click', e=>{

function setupSheet(edit){
  const draft = edit ? JSON.parse(JSON.stringify(game)) : {players:(roster.slice(0,4).length>=3?roster.slice(0,4):['','','']).map(n=>newPlayer(n))};
  const draw=()=>{
    const wopts=w=>`<option value="">Wonder…</option>`+Object.entries(WONDERS).map(([k,v])=>`<option value="${k}" ${w===k?'selected':''}>${v.n}</option>`).join('');
    $('#setup-body').innerHTML=`
      <div class="row" style="margin-bottom:10px"><div class="grow small muted">${draft.players.length} spelers · in zitvolgorde, met de klok mee</div>
        <button class="btn small" data-pc="-1" ${draft.players.length<=3?'disabled':''}>−</button><button class="btn small" data-pc="1" ${draft.players.length>=7?'disabled':''}>+</button></div>
      ${draft.players.map((p,i)=>`<div class="card" style="padding:10px">
        <div class="row"><span class="muted small" style="width:16px">${i+1}</span><input type="text" list="roster" placeholder="${defaultName(i+1)}" value="${esc(p.name)}" data-pn="${i}" autocomplete="off">
        ${i>0?`<button class="icon-btn" data-up="${i}" aria-label="Omhoog">▲</button>`:'<span style="width:30px"></span>'}</div>
        <div class="row" style="margin-top:6px;padding-left:24px"><select data-pw="${i}">${wopts(p.wonder)}</select>
        <div class="chips" style="flex:0 0 auto">${['A','B'].map(s=>`<button class="chip" data-ps="${i}:${s}" aria-pressed="${p.side===s}">${SIDE(s)}</button>`).join('')}</div>
        </div></div>`).join('')}
      <button class="btn small" data-rand>🎲 Willekeurige wonders</button>
      <p class="small muted">Eerste spel? Speel met de <b>Dag</b>-kant.</p>
      <datalist id="roster">${roster.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <button class="btn primary block" style="margin-top:8px" data-start>${edit?'Bewaren':'Start spel'}</button>`;
  };
  openSheet(edit?'Spelers & wonders':'Nieuw spel', '<div id="setup-body"></div>', {obj:draft});
  draw();
  const body=$('#setup-body');
  body.oninput=e=>{ if(e.target.dataset.pn!=null) draft.players[+e.target.dataset.pn].name=e.target.value; };
  body.onchange=e=>{ if(e.target.dataset.pw!=null) draft.players[+e.target.dataset.pw].wonder=e.target.value; };
  body.onclick=e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.pc){ if(+t.dataset.pc>0) draft.players.push(newPlayer('')); else draft.players.pop(); draw(); }
    else if(t.dataset.ps){ const [i,s]=t.dataset.ps.split(':'); draft.players[+i].side=s; draw(); }
    else if(t.dataset.up){ const i=+t.dataset.up; [draft.players[i-1],draft.players[i]]=[draft.players[i],draft.players[i-1]]; draw(); }
    else if(t.hasAttribute('data-rand')){ const ks=Object.keys(WONDERS).sort(()=>Math.random()-.5); draft.players.forEach((p,i)=>{p.wonder=ks[i];}); draw(); }
    else if(t.hasAttribute('data-start')){
      draft.players.forEach((p,i)=>{ p.name=p.name.trim()||defaultName(i+1); });
      const used=draft.players.map(p=>p.wonder).filter(Boolean);
      if(new Set(used).size!==used.length){ toast('Elk wonder kan maar één keer gekozen worden'); return; }
      roster=[...new Set([...draft.players.map(p=>p.name).filter(n=>!isDefaultName(n)), ...roster])].slice(0,20);
      if(edit){
        if(draft.players.length!==game.players.length){ draft.war=[null,null,null]; draft.cur=null; }  // andere tafel: veldslagen opnieuw
        game=draft;
      } else game=newGame(draft.players);
      closeSheet();
    }
  };
}

function sciAdvice(s, advSel, wildSel, noteSel){
  const cur=sciScore(s);
  const deltas=['t','c','g'].map(k=>({k, d:sciScore({...s,[k]:(+s[k]||0)+1}).vp-cur.vp}));
  const max=Math.max(...deltas.map(x=>x.d)), allEq=deltas.every(x=>x.d===max);
  $(advSel).innerHTML=deltas.map(x=>`<div class="${x.d===max&&!allEq?'best':''}">${symIcon(x.k)}<b>+${x.d}</b><span class="small muted">${SYM[x.k].n}</span></div>`).join('');
  const wildD=sciScore({...s,w:(+s.w||0)+1}).vp-cur.vp;
  const assigned=cur.add.map((n,i)=>n?`${n}× ${SYM['tcg'[i]].n.toLowerCase()}`:'').filter(Boolean);
  $(wildSel).innerHTML=`${(+s.w||0)?`Jokers het best gebruikt als: <b>${assigned.join(', ')}</b>. `:''}Een extra joker is <b>+${wildD}</b> waard. Volledige sets: <b>${Math.min(...cur.a)}</b>.`;
  if(noteSel) $(noteSel).textContent=`${cur.a.join(' / ')} → ${cur.a.map(x=>x*x).join('+')} + ${7*Math.min(...cur.a)}`;
}

function missingList(needs, prods){
  let best=null; const used=new Array(prods.length).fill(false);
  (function go(i, miss){
    if(best && miss.length>=best.length) return;
    if(i===needs.length){ best=miss.slice(); return; }
    for(let j=0;j<prods.length;j++) if(!used[j] && prods[j].includes(needs[i])){ used[j]=true; go(i+1,miss); used[j]=false; if(best&&best.length===0) return; }
    miss.push(needs[i]); go(i+1,miss); miss.pop();
  })(0,[]);
  return best||[];
}

function pickCtx(){
  const mi=meIdx(), p=game.players[mi], n=game.players.length;
  const age=Math.min(3,Math.max(1, game.pickAge || (phase()>=1&&phase()<=3?phase():3)));
  const [L,R]=neighbors(n,mi);
  const cur=(game.cur&&game.cur[age-1])||[];
  const nb=[cur[L],cur[R]].map(x=> (x==null||x==='')?null:+x);
  return {mi, p, n, age, ai:age-1, coins:+p.d.coins||0, L, R, nb, ids:new Set(p.city||[])};
}
function battle(me, nb, V){ return nb.reduce((s,x)=> s + (me>x?V:(me<x?-1:0)),0); }
function militaryValue(ctx, sh){
  const V=MIL_VP[ctx.ai], me=myShields(ctx.p), known=ctx.nb.every(x=>x!=null);
  const later=sh*0.5*(2-ctx.ai);   // schilden blijven tellen in de volgende tijdperken
  if(!known) return {v: V*0.75+later, why:`+${sh} schild${sh>1?'en':''}. Vul hierboven de schilden van je buren in voor beter advies.`};
  const d=battle(me+sh, ctx.nb, V)-battle(me, ctx.nb, V);
  // je buren kunnen nog schilden bijbouwen voor het einde van het tijdperk: tel de winst niet volledig
  const why = d>0 ? `Veldslag: tot <b>${PT(d).replace(/^/,'+')}</b> als je buren niet bijbouwen (jij ${me}→${me+sh} schilden, buren ${ctx.nb.join(' en ')})`
                  : `Verandert je veldslag nu niet (jij ${me}→${me+sh}, buren ${ctx.nb.join(' en ')})`;
  return {v:d*0.7+later, why};
}
function resourceValue(ctx, c){
  const prods=producers(ctx.p), has=r=>prods.some(o=>o.includes(r));
  const hi=[3.5,2.5,0.3][ctx.ai], lo=[1,0.6,0.1][ctx.ai];
  let v=0; const nw=[];
  (c.prod||[]).forEach(o=>{
    const n=o.filter(x=>!has(x) && !nw.includes(x));               // een 2e eenheid van dezelfde nieuwe grondstof telt minder
    if(n.length){ v+=hi*(o.length>1&&n.length>1?1.3:1); nw.push(...n); }
    else v+= o.some(x=>nw.includes(x)) ? (hi+lo)/2 : lo;
  });
  let why = nw.length ? `Nieuwe grondstof: <b>${uniq(nw).join(' / ')}</b>` : 'Deze grondstof maak je al';
  if(ctx.age===3) why+='. In tijdperk III zijn grondstoffen bijna niets meer waard';
  return {v, why};
}
function kidsBonus(ctx, c){
  const kids=(KIDS[c.id]||[]).filter(k=>!ctx.ids.has(k) && CARD[k].age>ctx.age);
  const v=kids.length*[1.5,1,0][ctx.ai];
  return {v, why: v>0 ? `Maakt later gratis: ${kids.map(k=>CARD[k].n).join(', ')}` : ''};
}
const NB_EST={brown:6,grey:4,blue:6,yellow:4,red:6,green:4};   // schatting: kaarten van die kleur bij je twee buren samen op het einde
function cardValue(ctx, c){
  const p=ctx.p, why=[]; let v=0;
  switch(c.col){
    case 'blue': v=c.vp; why.push(`<b>${c.vp} punten</b>`); break;
    case 'green': {
      const s=sciState(p), now=sciScore(s).vp, after=sciScore({...s,[c.sym]:s[c.sym]+1}).vp;
      v=after-now; why.push(`Wetenschap: <b>+${PT(v)}</b> (${SYMNAME[c.sym]})`);
      if(ctx.age<3) { v+= [1,0.5,0][ctx.ai]; }
      break; }
    case 'red': { const m=militaryValue(ctx,c.sh); v=m.v; why.push(m.why); break; }
    case 'brown': case 'grey': { const r=resourceValue(ctx,c); v=r.v; why.push(r.why); break; }
    case 'yellow': {
      const n={yellow:countCol(p,'yellow')+1, brown:countCol(p,'brown'), grey:countCol(p,'grey'), red:countCol(p,'red'), st:stagesBuilt(p)};
      const Y={
        tavern:[5/3+0.5,'+5 munten'],
        westtradingpost:[[2.5,1.2,0.2][ctx.ai],'Bruine grondstoffen kopen bij je <b>linkerbuur</b> voor 1 munt'],
        easttradingpost:[[2.5,1.2,0.2][ctx.ai],'Bruine grondstoffen kopen bij je <b>rechterbuur</b> voor 1 munt'],
        marketplace:[[2,1.2,0.2][ctx.ai],'Grijze grondstoffen kopen bij je buren voor 1 munt'],
        caravansery:[[3,3,0.3][ctx.ai],'Elke beurt 1 bruine grondstof naar keuze'],
        forum:[[3,3,0.3][ctx.ai],'Elke beurt 1 grijze grondstof naar keuze'],
        vineyard:[(n.brown+4)/3,`± ${n.brown+4} munten (bruine kaarten van jou en je buren)`],
        bazaar:[2*(n.grey+3)/3,`± ${2*(n.grey+3)} munten (grijze kaarten van jou en je buren)`],
        lighthouse:[n.yellow*4/3,`<b>${n.yellow} punten</b> + ${n.yellow} munten`],
        haven:[n.brown*4/3,`<b>${n.brown} punten</b> + ${n.brown} munten`],
        chamberofcommerce:[n.grey*8/3,`<b>${2*n.grey} punten</b> + ${2*n.grey} munten`],
        ludus:[n.red*2,`<b>${n.red} punten</b> + ${3*n.red} munten`],
        arena:[n.st*2+1,`<b>${n.st} punten</b> + ${3*n.st} munten (meer als je nog wonderfases bouwt)`],
      }[c.id]||[1,''];
      v=Y[0]; why.push(Y[1]); break; }
    case 'purple': {
      const est=(col,m)=>{ const x=NB_EST[col]*m; return [x, `± <b>${x} punten</b> (schatting: tel de ${COLNAME[col]}e kaarten van je buren)`]; };
      const total=stageList(p).length, built=stagesBuilt(p), left=total-built;
      const G={
        workers:est('brown',1), craftsmen:est('grey',2), magistrates:est('blue',1), traders:est('yellow',1), spies:est('red',1), philosophers:est('green',1),
        builders:[built+1+4, `± <b>${built+1+4} punten</b> (jouw wonderfases + die van je buren)`],
        shipowners:[countCol(p,'brown')+countCol(p,'grey')+countCol(p,'purple')+1, `<b>${countCol(p,'brown')+countCol(p,'grey')+countCol(p,'purple')+1} punten</b> (jouw bruine, grijze en paarse kaarten)`],
        decorators:[left===0?7:left===1?5:left===2?2.5:0, left===0?'<b>7 punten</b>: je wonder is af':`7 punten <b>als</b> je de laatste ${left} wonderfase${left>1?'s':''} nog bouwt`],
        scientists:(()=>{ const s=sciState(p), d=sciScore({...s,w:s.w+1}).vp-sciScore(s).vp; return [d, `Joker voor wetenschap: <b>+${PT(d)}</b>`]; })(),
      }[c.id]||[3,''];
      v=G[0]; why.push(G[1]); break; }
  }
  const k=kidsBonus(ctx,c); if(k.v){ v+=k.v; why.push(k.why); }
  return {v, why};
}
function analyze(ctx, c){
  const p=ctx.p, r={c, why:[]};
  if(ctx.ids.has(c.id)){ r.dup=true; r.ok=false; r.val=-99; r.costTxt='Heb je al'; r.why.push('Je mag geen 2 dezelfde kaarten bouwen. Verkoop ze of leg ze onder je wonder.'); return r; }
  let coins=c.coins, buy=[], olympia=stagesBuilt(p)>1 && p.wonder==='olympia' && p.side==='A' && countCol(p,c.col)===0;
  if(c.from && c.from.some(f=>ctx.ids.has(f))){ r.free=true; coins=0; r.costTxt='🔗 Gratis via keten'; }
  else if(olympia){ r.free=true; coins=0; r.costTxt='Gratis (Olympía: eerste '+COLNAME[c.col]+'e kaart)'; }
  else {
    buy=missingList(c.cost, producers(p));
    const price=buy.reduce((s,x)=>s+buyPrice(x,ctx.ids),0);
    coins+=Math.ceil(price);
    r.costTxt = !c.cost.length && !c.coins ? 'Gratis' :
      [buy.length?`Koop ${buy.join(', ')} bij je buren (± ${Math.ceil(price)} munten)`:(c.cost.length?'Je hebt alle grondstoffen':''), c.coins?`${c.coins} munt aan de bank`:''].filter(Boolean).join(' + ');
  }
  r.coins=coins; r.buy=buy; r.ok=coins<=ctx.coins;
  const cv=cardValue(ctx,c); r.why=cv.why.filter(Boolean);
  r.val=cv.v - coins/3;
  if(!r.ok) r.why.unshift(`<b>Te duur</b>: je hebt ${coins} munten nodig en hebt er ${ctx.coins}.`);
  else if(buy.length) r.why.push(`Je buren moeten ${buy.join(', ')} hebben. Kijk even na.`);
  return r;
}
function stageOption(ctx){
  const p=ctx.p, list=stageList(p), i=stagesBuilt(p);
  if(!WONDERS[p.wonder] || i>=list.length) return null;
  const needs=(STAGE_COST[p.wonder]&&STAGE_COST[p.wonder][p.side]&&STAGE_COST[p.wonder][p.side][i])||[];
  const buy=missingList(needs, producers(p)), price=Math.ceil(buy.reduce((s,x)=>s+buyPrice(x,ctx.ids),0));
  const f=stageFx(p,i), why=[];
  let v=list[i].vp; if(v) why.push(`<b>${v} punten</b>`);
  if(f.coins){ v+=f.coins/3; why.push(`+${f.coins} munten`); }
  if(f.sh){ const m=militaryValue(ctx,f.sh); v+=m.v; why.push(m.why); }
  if(f.wild){ const s=sciState(p), d=sciScore({...s,w:s.w+1}).vp-sciScore(s).vp; v+=Math.max(d,4); why.push(`Joker voor wetenschap (nu +${d}, groeit nog)`); }
  if(f.prod){ v+=[4,3,0.5][ctx.ai]; why.push('Elke beurt een grondstof naar keuze'); }
  if(f.freeColor||f.freeFirst||f.freeLast){ v+=(3-ctx.ai)*2; why.push('Gratis kaarten bouwen'); }
  if(f.discard){ v+=[3,4,5][ctx.ai]; why.push('Gratis een kaart uit de aflegstapel bouwen'); }
  if(f.lastCard){ v+=(3-ctx.ai)*1.5; why.push('Elk tijdperk een extra kaart spelen'); }
  return {i, v:v-price/3, coins:price, ok:price<=ctx.coins, buy, why, txt:stageText(list[i])};
}
function adviseHand(ctx, hand){
  const rows=hand.map(id=>analyze(ctx, CARD[id])).sort((a,b)=> (b.ok-a.ok) || (b.val-a.val));
  const worst=rows.slice().sort((a,b)=>(a.dup?-1:0)-(b.dup?-1:0) || a.val-b.val)[0];
  const st=stageOption(ctx);
  const sell={v: 1 + (ctx.coins<3?0.5:0)};
  const best=rows.find(r=>r.ok && !r.dup);
  let rec;
  const opts=[];
  if(best) opts.push({kind:'build', v:best.val, r:best});
  if(st && st.ok && worst) opts.push({kind:'stage', v:st.v, r:worst});
  if(worst) opts.push({kind:'sell', v:sell.v, r:worst});
  rec=opts.sort((a,b)=>b.v-a.v)[0];
  return {rows, st, sell, rec, worst};
}

function cardChip(c, on, attr){
  const extra=c.prod?c.prod.map(o=>o.join('/')).join(' + '):c.vp?`${c.vp} pt`:c.sh?`${c.sh} schild${c.sh>1?'en':''}`:c.sym?SYMNAME[c.sym]:'';
  return `<button class="chip cardchip" ${attr} aria-pressed="${on}"><span class="cdot" style="background:${COLVAR[c.col]}"></span>${esc(c.n)}${extra?` <span class="cx">${extra}</span>`:''}</button>`;
}
function cardPicker(title, ids, filter, max, onDone){
  const sel=new Set(ids);
  const draw=()=>{
    const groups=COLORDER.map(col=>{ const cs=uniq(CARDS.filter(c=>c.col===col && filter(c)).map(c=>c.id)).map(id=>CARD[id]); return cs.length?`<div class="sec-title" style="margin-top:10px">${COLNAME[col]}</div><div class="chips">${cs.map(c=>cardChip(c, sel.has(c.id), `data-cpick="${c.id}"`)).join('')}</div>`:''; }).join('');
    $('#picker-body').innerHTML=`<p class="small muted" style="margin-top:0">${max?`Tik de kaarten aan (max. ${max}). Gekozen: <b>${sel.size}</b>`:`Gekozen: <b>${sel.size}</b>`}</p>${groups}<button class="btn primary block" style="margin-top:14px" data-cdone>Klaar</button>`;
  };
  openSheet(title, '<div id="picker-body"></div>', {obj:{}});
  draw();
  $('#picker-body').onclick=e=>{
    const b=e.target.closest('[data-cpick]');
    if(b){ const id=b.dataset.cpick; if(sel.has(id)) sel.delete(id); else if(!max||sel.size<max) sel.add(id); else toast(`Maximaal ${max} kaarten`); draw(); return; }
    if(e.target.closest('[data-cdone]')){ onDone([...sel]); closeSheet(); }
  };
}

function doneTurn(p, msg){ p.hand=[]; save(); renderPick(); toast(msg); window.scrollTo(0,0); }
$('#v-pick').addEventListener('click', e=>{

  if(t.hasAttribute('data-me-change')){ game.me=null; save(); renderPick(); return; }

    gain={tavern:5,lighthouse:nn.yellow,haven:nn.brown,chamberofcommerce:2*nn.grey,ludus:3*nn.red,arena:3*nn.st}[c.id]||0;

      $('#vs-'+i).innerHTML=neighbors(n,i).map(j=>{
        const r=s[i]>s[j]?'w':s[i]<s[j]?'l':'t';
        return `<span class="tok ${r}">${r==='w'?'+'+MIL_VP[age]:r==='l'?'−1':'0'} tegen ${esc(game.players[j].name)}</span>`;
      }).join('');
    });
    const btn=v.querySelector('[data-record]'), rec=!!game.war[age]&&game.war[age].every((x,i)=>x===s[i]);
    btn.className='btn block '+(rec?'':'primary');
    btn.textContent=rec?`Tijdperk ${AGE[age]} genoteerd ✓`:(game.war[age]?'Genoteerd resultaat bijwerken':`Veldslag tijdperk ${AGE[age]} noteren`);
  };
  wrap._upd();
}
function warExplainer(){
  return `<div class="sec-title">Zo werkt een veldslag</div><div class="card small">
  <p style="margin-top:0">Op het einde van elk tijdperk vergelijk je je schilden met <b>elk</b> van je twee buren. Meer schilden: je krijgt een overwinningsfiche (+1, +3 of +5). Minder: een nederlaagfiche (−1). Gelijk: niets.</p>
  <p style="margin-bottom:0">Alleen je buren tellen. Negeren ze allebei militair, dan wint één goedkope rode kaart je beide veldslagen.</p></div>`;
}
$('#v-war').addEventListener('click', e=>{
  const ag=e.target.closest('[data-age]');
  if(ag){ warAge=+ag.dataset.age; save(); renderWar(); return; }
  if(e.target.closest('[data-record]')){ game.war[warAge]=game.cur[warAge].slice(); save(); toast(warAge===2&&phase()===4?'Laatste veldslag genoteerd. Tijd voor de eindscore!':`Tijdperk ${AGE[warAge]} genoteerd`); if(warAge<2) warAge++; renderAll(); return; }
  if(e.target.closest('[data-unrecord]')){ game.war[warAge]=null; save(); renderAll(); return; }
  if(e.target.closest('[data-act="new"]')) setupSheet();
});

/* ============ WONDERS ============ */
function renderWonders(){
  const v=$('#v-wonders');
  v.innerHTML=`<div class="chips" style="margin-bottom:12px">${['A','B'].map(s=>`<button class="chip" data-side="${s}" aria-pressed="${wonderSide===s}">${SIDE(s)}</button>`).join('')}</div>
    ${Object.values(WONDERS).map(Wd=>{ const st=Wd[wonderSide]; const vp=st.reduce((a,s)=>a+s.vp,0); return `<div class="card wonder">
      <div class="row"><h3 class="grow">${Wd.n}</h3><span class="tag">start met ${RES[Wd.res]}</span><span class="tag">${PT(vp)}</span></div>
      <div class="small muted" style="margin-bottom:6px">${Wd.full}</div>
      ${st.map((s,i)=>`<div class="stage"><span class="n">${i+1}</span><span>${stageText(s)}</span></div>`).join('')}
      <ul class="small" style="padding-left:18px;margin:10px 0 0">${Wd.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`; }).join('')}`;
}
$('#v-wonders').addEventListener('click', e=>{ const s=e.target.closest('[data-side]'); if(s){ wonderSide=s.dataset.side; renderWonders(); } });

/* ============ GIDS ============ */
const step = (n, title, html) => `<div class="gstep"><span class="gnum">${n}</span><div><b>${title}</b>${html}</div></div>`;

  <p style="margin-top:0">Na de veldslag van tijdperk III tel je de punten met het tabblad <b>Score</b>, in dezelfde volgorde als het scoreblok:</p><ol>

 {t:'⭐ 6 tips voor je eerste spel', h:`<ol>
  <li><b>Tijdperk I: grondstoffen.</b> Neem bruine en grijze kaarten, vooral die met twee grondstoffen.</li>

  <li><b>Vergeet je wonder niet.</b> Elke fase is punten of voordeel.</li></ol>`},
 {t:'🔗 Ketens (gratis bouwen)', h:()=>chainsHtml()},

function chainsHtml(){
  const tbl=(head,rows)=>`<table class="mini" style="margin-top:10px"><tr><th>${head[0]}</th><th>${head[1]}</th></tr>${rows.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>`;
  return `<p class="small muted" style="margin:0">Heb je de linkse kaart, dan bouw je de rechtse <b>gratis</b>. Op de kaarten zie je dit als een klein symbooltje.</p>`
    +tbl(['Tijdperk I','→ Tijdperk II'],[['Bron','Beeld'],['Badhuis','Aquaduct'],['Handelspost Oost / West','Forum'],['Marktplaats','Karavanserai'],['Apotheek','Stallen, Hospitaal'],['Werkplaats','Schietbaan, Laboratorium'],['Scriptorium','Rechtszaal, Bibliotheek']])
    +tbl(['Tijdperk I','→ Tijdperk III'],[['Altaar','Pantheon'],['Theater','Tuinen']])
    +tbl(['Tijdperk II','→ Tijdperk III'],[['Forum','Haven'],['Karavanserai','Vuurtoren'],['Muren','Vestingwerk'],['Trainingsplaats','Circus'],['Hospitaal','Herberg, Arena'],['Laboratorium','Observatorium, Legerwerkplaats'],['Bibliotheek','Senaat, Universiteit'],['School','Academie, College']]);
}
function renderGuide(){
  $('#v-guide').innerHTML=GUIDE.map(g=>`<details ${g.open?'open':''}><summary>${g.t}</summary><div class="body">${typeof g.h==='function'?g.h():g.h}</div></details>`).join('')+
  `<p class="small muted" style="text-align:center">Onofficiële hulp-app. 7 Wonders is een spel van Antoine Bauza, uitgegeven door Repos Production.</p>`;
}

/* ============ NAVIGATIE ============ */
const TABS={score:renderScore, pick:renderPick, war:renderWar, wonders:renderWonders, guide:renderGuide};
const SUB={score:'Scoreblok', pick:'Welke kaart leg ik?', war:'Veldslagteller', wonders:'Wonderborden', guide:'Spelregels'};
let tab=LS.get('tab', LS.get('game',null)?'score':'guide'); if(!TABS[tab]) tab='score';
function show(t){
  if(t==='pick' && game){ const ph=phase(); if(ph>=1&&ph<=3) game.pickAge=ph; }
  if(t==='war' && game){ const f=game.war.findIndex(x=>!x); if(f>=0){ warAge=f; LS.set('warAge',warAge); } }
  tab=t; LS.set('tab',t);
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+t));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===t?'page':'false'));
  $('#subtitle').textContent=SUB[t];
  TABS[t](); window.scrollTo(0,0);
}
function renderAll(){ TABS[tab](); }
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(b) show(b.dataset.tab); });
const applyTheme=t=>{ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; };
let theme=LS.get('theme',null); applyTheme(theme);
$('#themeBtn').onclick=()=>{ const cur=theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); theme=cur==='dark'?'light':'dark'; LS.set('theme',theme); applyTheme(theme); };
if(!theme && matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light');
show(tab);
async function wake(){ try{ if(game && 'wakeLock' in navigator && document.visibilityState==='visible') await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', wake); wake();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
