<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonders Companion</title>
<meta name="description" content="Score pad, science optimizer, military tracker and strategy guide for 7 Wonders.">
<meta name="theme-color" content="#1b1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wonders">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#1b1712; --bg2:#241f18; --card:#2c261d; --line:#3d3528; --text:#f3ead8; --muted:#b4a68b; --accent:#e3b04b; --accent-ink:#1b1712;
  --mil:#d9534a; --coin:#e8c040; --wonder:#b08f62; --civ:#4b8ee0; --com:#e8902f; --guild:#a466d6; --sci:#47b26b; --leaders:#e9e4da; --cities:#6c6c6c; --debt:#9a3b34;
  --win:#47b26b; --lose:#d9534a; --tie:#8a7f6a;
  --radius:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  --bg:#f5efe2; --bg2:#ece3d0; --card:#fffaf0; --line:#dccfb4; --text:#2a2318; --muted:#7a6c52; --accent:#a8741a; --accent-ink:#fffaf0;
  --cities:#555; --leaders:#9b927f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding-bottom:calc(72px + var(--safe-b))}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:19px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.5px;flex:1}
header.top .sub{font-size:12px;color:var(--muted);font-family:system-ui}
main{padding:14px 16px 24px;max-width:860px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--lose)}
.lang-btn{font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--text)}
.icon-btn{background:none;border:0;padding:6px;cursor:pointer;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* Score pad */
.podium{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.podium .p{flex:0 0 auto;min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.podium .p.lead{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.podium .rank{font-size:12px;color:var(--muted)}
.podium .tot{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.podium .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pad-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.pad{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.pad th,table.pad td{padding:0;border-bottom:1px solid var(--line);text-align:center}
table.pad thead th{font-size:13px;padding:8px 4px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.pad thead th .w{display:block;font-size:11px;color:var(--muted);font-weight:400}
table.pad th.cat{white-space:nowrap;position:sticky;left:0;background:var(--card);text-align:left;padding:0 8px;min-width:96px;font-size:13px;font-weight:600;z-index:1}
table.pad th.cat .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.pad td button{width:100%;min-width:52px;height:44px;background:none;border:0;font-size:17px;cursor:pointer}
table.pad td button.zero{color:var(--muted);opacity:.55}
table.pad tr.total td,table.pad tr.total th{border-bottom:0;font-weight:800;font-size:19px;padding:10px 4px;background:var(--bg2)}
table.pad tr.total th.cat{background:var(--bg2)}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 12px}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--safe-b));border-top:1px solid var(--line)}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .hd h2{font-size:18px;flex:1}
.big-out{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.out-row{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}
.field{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .lbl{flex:1;min-width:0}
.field .lbl b{display:block;font-size:15px}
.field .lbl span{display:block;font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex:0 0 auto}
.step button{width:40px;height:40px;border:0;background:none;font-size:20px;cursor:pointer}
.step input{width:46px;height:40px;border:0;background:none;text-align:center;font-size:17px;font-weight:700;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=text],select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--accent)}
/* Science */
.sym{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--sci);color:#fff;flex:0 0 auto}
.sym svg{width:20px;height:20px}
.advice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.advice div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.advice div.best{border-color:var(--sci);box-shadow:0 0 0 1px var(--sci) inset}
.advice b{display:block;font-size:20px}
table.mini{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
table.mini th{color:var(--muted);font-weight:600}
table.mini td:first-child,table.mini th:first-child{text-align:left}
/* War */
.war-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.war-row:last-child{border-bottom:0}
.vs{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tok{font-size:12px;border-radius:6px;padding:2px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.tok.w{background:color-mix(in srgb,var(--win) 25%,transparent);color:var(--win)}
.tok.l{background:color-mix(in srgb,var(--lose) 25%,transparent);color:var(--lose)}
.tok.t{background:color-mix(in srgb,var(--tie) 25%,transparent);color:var(--muted)}
.age-badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;color:#fff}
.a1{background:#8a5a2b}.a2{background:#5b6f87}.a3{background:#7a4a8f}
/* Guide */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
details summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:20px}
details[open] summary::after{content:"–"}
details .body{padding:0 14px 14px}
details .body p,details .body li{font-size:15px}
details .body ul{padding-left:20px;margin:6px 0}
.wonder h3{font-family:Georgia,serif;font-size:18px}
.stage{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stage:last-child{border-bottom:0}
.stage .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--wonder);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-right:4px}
.empty{text-align:center;padding:30px 10px}
.empty .seal{width:84px;height:84px;margin:0 auto 12px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist-item:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 2px 8px;font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="grow"><h1>Wonders Companion</h1><div class="sub" id="subtitle">Score · Science · War · Strategy</div></div>
  <button class="icon-btn lang-btn" id="langBtn">NL</button>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<main>
  <section class="view on" id="v-score"></section>
  <section class="view" id="v-sci"></section>
  <section class="view" id="v-war"></section>
  <section class="view" id="v-wonders"></section>
  <section class="view" id="v-guide"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="score" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Score</span></button>
  <button data-tab="sci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Science</span></button>
  <button data-tab="war"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg><span>War</span></button>
  <button data-tab="wonders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 20h18z"/><path d="M8 20l4-8 4 8"/></svg><span>Wonders</span></button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg><span>Guide</span></button>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ STORAGE + LANGUAGE ============ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('7wc.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('7wc.'+k, JSON.stringify(v)); }catch(e){} },
};
let lang = LS.get('lang', ((navigator.language||'')+'').toLowerCase().startsWith('nl') ? 'nl' : 'en');
const L = (en, nl) => lang==='nl' ? nl : en;            // inline bilingual text
const tx = v => Array.isArray(v) ? (lang==='nl' ? v[1] : v[0]) : v;   // [en, nl] data text
const VP = n => L(`${n} VP`, `${n} ${n===1?'punt':'punten'}`);
const VPshort = L('VP','pt');

/* ============ DATA ============ */
const CATS = [
  {k:'mil', n:['Military','Militair'], c:'var(--mil)'},
  {k:'coin', n:['Treasury','Schatkist'], c:'var(--coin)'},
  {k:'wonder', n:['Wonder','Wereldwonder'], c:'var(--wonder)'},
  {k:'civ', n:['Civilian','Burgerlijk'], c:'var(--civ)'},
  {k:'com', n:['Commerce','Handel'], c:'var(--com)'},
  {k:'guild', n:['Guilds','Gilden'], c:'var(--guild)'},
  {k:'sci', n:['Science','Wetenschap'], c:'var(--sci)'},
  {k:'leaders', n:['Leaders','Leiders'], c:'var(--leaders)', exp:'leaders'},
  {k:'cities', n:['Cities','Steden'], c:'var(--cities)', exp:'cities'},
  {k:'debt', n:['Debt','Schulden'], c:'var(--debt)', exp:'cities', neg:true},
];
const CAT_HINT = {
  civ:['Sum the VP printed on your blue cards.','Tel de punten op je blauwe kaarten op.'],
  leaders:['Sum the VP from your Leader cards.','Tel de punten van je leiderskaarten op.'],
  cities:['Sum the VP from your black City cards.','Tel de punten van je zwarte stadskaarten op.'],
  debt:['Number of debt tokens (each is −1 VP).','Aantal schuldfiches (elk −1 punt).'],
};
const RES = {ore:['Ore','Erts'], glass:['Glass','Glas'], papyrus:['Papyrus','Papyrus'], clay:['Clay','Klei'], wood:['Wood','Hout'], loom:['Loom (textile)','Textiel'], stone:['Stone','Steen']};
// Shared stage effects
const E = {
  shields2:['2 shields','2 schilden'],
  raw:['1 raw resource of your choice each turn','Elke beurt 1 grondstof naar keuze (bruin)'],
  grey:['1 manufactured good of your choice each turn','Elke beurt 1 fabricaat naar keuze (grijs)'],
  sci:['1 science symbol of your choice (wild)','1 wetenschapssymbool naar keuze (joker)'],
  coins9:['9 coins','9 munten'],
  discard:['Build one card from the discard pile for free','Bouw gratis 1 kaart uit de aflegstapel'],
};
const pts = n => [`${n} VP`, `${n} punten`];
// Wonders. vp = direct victory points per stage. Side 'A'/'B' = Day/Night in the 2020 edition.
// 1st edition (2010) boards:
const WONDERS1 = {
  rhodes:{n:'Rhodes', full:['The Colossus of Rhodes','De Kolossus van Rhodos'], res:'ore',
    A:[{vp:3},{vp:0,t:E.shields2},{vp:7}],
    B:[{vp:3,t:['1 shield, 3 VP, 3 coins','1 schild, 3 punten, 3 munten']},{vp:4,t:['1 shield, 4 VP, 4 coins','1 schild, 4 punten, 4 munten']}],
    tips:[['The military wonder: shields from stages are “free” red cards, so you can win most battles while buying fewer red cards.','Het militaire wonder: schilden op je bouwfases zijn “gratis” rode kaarten, dus je wint de meeste veldslagen met minder rode kaarten.'],
          ['Ore start makes red cards and Age II weapons cheap. Make your neighbors pay to keep up.','Met erts als start zijn rode kaarten goedkoop. Laat je buren betalen om bij te blijven.'],
          ['Side B is fast (2 stages) and gives coins, which suits a flexible game.','Kant B is snel (2 fases) en geeft munten, ideaal voor een flexibel spel.']]},
  alexandria:{n:'Alexandria', full:['The Lighthouse of Alexandria','De Vuurtoren van Alexandrië'], res:'glass',
    A:[{vp:3},{vp:0,t:E.raw},{vp:7}],
    B:[{vp:0,t:E.raw},{vp:0,t:E.grey},{vp:7}],
    tips:[['Resource flexibility means you can skip many brown/grey cards and draft points instead.','Dankzij je flexibele grondstoffen kun je veel bruine/grijze kaarten overslaan en punten nemen.'],
          ['Build the resource stages early, since they pay off every remaining turn.','Bouw de grondstof-fases vroeg: ze leveren elke resterende beurt op.'],
          ['Glass start pairs naturally with science (green cards often need glass).','Glas als start past goed bij wetenschap (groene kaarten vragen vaak glas).']]},
  ephesus:{n:'Ephesus', full:['The Temple of Artemis in Ephesus','De Tempel van Artemis in Efeze'], res:'papyrus',
    A:[{vp:3},{vp:0,t:E.coins9},{vp:7}],
    B:[{vp:2,t:['2 VP, 4 coins','2 punten, 4 munten']},{vp:3,t:['3 VP, 4 coins','3 punten, 4 munten']},{vp:5,t:['5 VP, 4 coins','5 punten, 4 munten']}],
    tips:[['Coins buy whatever you lack from neighbors, so play the flexible “buy, don’t build” game.','Met munten koop je wat je mist bij je buren: speel “kopen, niet bouwen”.'],
          ['Papyrus is used by science and some blue cards; both are good fits.','Papyrus is nodig voor wetenschap en sommige blauwe kaarten: beide passen goed.'],
          ['Left-over coins still score 1 VP per 3 at the end.','Overgebleven munten zijn op het einde nog 1 punt per 3 waard.']]},
  babylon:{n:'Babylon', full:['The Hanging Gardens of Babylon','De Hangende Tuinen van Babylon'], res:'clay',
    A:[{vp:3},{vp:0,t:E.sci},{vp:7}],
    B:[{vp:3},{vp:0,t:['Play the 7th (last) card of each age instead of discarding it','Speel de 7e (laatste) kaart van elk tijdperk in plaats van ze af te leggen']},{vp:0,t:E.sci}],
    tips:[['The science wonder: the wild symbol is often worth 10+ VP late in the game.','Het wetenschapswonder: het jokersymbool is laat in het spel vaak 10+ punten waard.'],
          ['Commit to green cards in Age I so their chains make Age II/III science free.','Kies in tijdperk I voor groen, zodat de ketens latere wetenschap gratis maken.'],
          ['Side B stage 2 lets you play an extra card every age; build it early.','Kant B fase 2 laat je elk tijdperk een extra kaart spelen: bouw ze vroeg.']]},
  olympia:{n:'Olympia', full:['The Statue of Zeus in Olympia','Het Beeld van Zeus in Olympia'], res:'wood',
    A:[{vp:3},{vp:0,t:['Once per age, build a structure for free','Eén keer per tijdperk een gebouw gratis bouwen']},{vp:7}],
    B:[{vp:0,t:['Buy raw resources from both neighbors for 1 coin','Koop grondstoffen bij beide buren voor 1 munt']},{vp:5},{vp:0,t:['Copy one guild built by a neighbor at game end','Kopieer op het einde 1 gilde van een buur']}],
    tips:[['Side A: save the free build for the most expensive card of each age (Palace, Pantheon, guilds).','Kant A: gebruik de gratis bouw voor de duurste kaart van het tijdperk (Paleis, Pantheon, gilden).'],
          ['Side B: watch both neighbors’ guilds in Age III and copy the best one.','Kant B: let in tijdperk III op de gilden van je buren en kopieer de beste.'],
          ['Very flexible; adapts to whatever strategy the cards offer.','Zeer flexibel: past zich aan aan wat de kaarten bieden.']]},
  halicarnassus:{n:'Halicarnassus', full:['The Mausoleum of Halicarnassus','Het Mausoleum van Halicarnassus'], res:'loom',
    A:[{vp:3},{vp:0,t:E.discard},{vp:7}],
    B:[{vp:2,t:['2 VP + build a discarded card free','2 punten + bouw gratis een afgelegde kaart']},{vp:1,t:['1 VP + build a discarded card free','1 punt + bouw gratis een afgelegde kaart']},{vp:0,t:['Build a discarded card free','Bouw gratis een afgelegde kaart']}],
    tips:[['Time the discard-build for the end of an age, when the pile holds the most cards (including the end-of-age discards).','Bouw deze fase op het einde van een tijdperk, als de aflegstapel het grootst is (inclusief de afgelegde laatste kaarten).'],
          ['Everyone hate-discards in Age III; great guilds and science often end up in the pile.','In tijdperk III legt iedereen kaarten af om buren te blokkeren: sterke gilden en wetenschap belanden vaak op de stapel.'],
          ['Side B gives three free cards; pick your best synergy each time.','Kant B geeft drie gratis kaarten: kies telkens wat het best past.']]},
  giza:{n:'Giza', full:['The Pyramids of Giza','De Piramides van Gizeh'], res:'stone',
    A:[{vp:3},{vp:5},{vp:7}],
    B:[{vp:3},{vp:5},{vp:5},{vp:7}],

/* ============ SCORING ============ */
function sciScore(s){
  const t=+s.t||0, c=+s.c||0, g=+s.g||0, w=Math.max(0,+s.w||0);
  let best={vp:-1, a:[t,c,g], add:[0,0,0]};
  for(let i=0;i<=w;i++) for(let j=0;j<=w-i;j++){
    const k=w-i-j, a=[t+i,c+j,g+k];
    const vp=a[0]*a[0]+a[1]*a[1]+a[2]*a[2]+7*Math.min(...a);
    if(vp>best.vp) best={vp, a, add:[i,j,k]};
  }
  return best;
}
function neighbors(n,i){ return [(i-1+n)%n, (i+1)%n]; }
function warTokens(g){
  const n=g.players.length, res=g.players.map(()=>({p1:0,p3:0,p5:0,m1:0,vp:0}));
  g.war.forEach((sh,age)=>{
    if(!sh) return;
    for(let i=0;i<n;i++) for(const j of neighbors(n,i)){
      if(sh[i]>sh[j]){ res[i]['p'+MIL_VP[age]]++; res[i].vp+=MIL_VP[age]; }
      else if(sh[i]<sh[j]){ res[i].m1++; res[i].vp--; }
    }
  });
  return res;
}
function catScore(g, pi, k, war){
  const p=g.players[pi], d=p.d, man=+d.man[k]||0;
  switch(k){
    case 'coin': return Math.floor((+d.coins||0)/3)+man;
    case 'sci': return sciScore(d.sci).vp+man;
    case 'mil': { const m=d.mil; return (war||warTokens(g))[pi].vp + m.p1+3*m.p3+5*m.p5-m.m1 + man; }
    case 'wonder': { let v=man; if(p.wonder){ const st=W(g.ed)[p.wonder][p.side]; (d.stages||[]).forEach((b,i)=>{ if(b&&st[i]) v+=st[i].vp; }); } return v; }
    case 'guild': return GL(g.ed).reduce((s,x)=>s+(+d.guild[x.k]||0)*x.m,0)+man;
    case 'com': return CL(g.ed).reduce((s,x)=>s+(+d.com[x.k]||0)*x.m,0)+man;
    case 'debt': return -Math.abs(man);
    default: return man;
  }
}
function activeCats(g){ return CATS.filter(c=>!c.exp || g.exp[c.exp]); }
function totals(g){
  const war=warTokens(g);
  return g.players.map((p,i)=>{
    const by={}; let tot=0;
    activeCats(g).forEach(c=>{ by[c.k]=catScore(g,i,c.k,war); tot+=by[c.k]; });
    return {i, name:p.name, tot, by, coins:+p.d.coins||0};
  });
}
function ranking(g){ return totals(g).sort((a,b)=> b.tot-a.tot || b.coins-a.coins); }

  return `<div class="sec-title">${L('History','Geschiedenis')}</div>
  <div class="card">${top.length?`<div class="small muted" style="margin-bottom:6px">${L('Wins','Overwinningen')}: ${top.map(([n,c])=>`<b style="color:var(--text)">${esc(n)}</b> ${c}`).join(' · ')}</div>`:''}
  ${history.slice(0,15).map((h,ix)=>`<div class="hist-item"><div class="grow"><b>${esc(h.results[0].name)}</b> ${L('won with','won met')} ${h.results[0].tot}<div class="small muted">${dateFmt(h.date)} · ${h.results.map(r=>esc(r.name)+' '+r.tot).join(', ')}</div></div><button class="icon-btn" data-hdel="${ix}" aria-label="${L('Delete','Verwijderen')}">✕</button></div>`).join('')}</div>`;
}

  if(a==='new') setupSheet();
  if(a==='players') setupSheet(true);
  if(a==='discard' && confirm(L('Discard the current game?','Het huidige spel verwijderen?'))){ game=null; save(); renderAll(); }
  if(a==='finish'){
    const rk=ranking(game);
    if(rk.every(r=>r.tot===0)){ toast(L('Enter some scores first','Vul eerst scores in')); return; }
    history.unshift({date:game.date, results:rk.map(r=>({name:r.name, tot:r.tot, wonder:game.players[r.i].wonder}))});
    const winner=rk[0].name; game=null; save(); renderAll(); toast(L(`🏆 ${winner} wins! Saved to history.`,`🏆 ${winner} wint! Bewaard in de geschiedenis.`));
  }
});

function editCat(pi,k){
  const p=game.players[pi], d=p.d, c=CATS.find(x=>x.k===k);
  const title=`<span style="color:${c.c}">●</span> ${esc(p.name)} · ${tx(c.n)}`;
  const out=`<div class="out-row"><div class="big-out" id="o-vp">0</div><div class="muted">${VPshort}</div><div class="grow small muted" id="o-note" style="text-align:right"></div></div>`;
  const manual=(lbl,sub)=>`<div class="field"><div class="lbl"><b>${lbl}</b>${sub?`<span>${sub}</span>`:''}</div>${stepper('man.'+k, d.man[k])}</div>`;
  let body='', upd=()=>{};
  const base=()=>{ $('#o-vp').textContent=catScore(game,pi,k); };
  if(k==='coin'){
    body=`${out}<div class="card"><div class="field"><div class="lbl"><b>${L('Coins in treasury','Munten in de schatkist')}</b><span>${L('1 VP per 3 coins. Coins also break ties.','1 punt per 3 munten. Munten beslissen ook bij gelijkstand.')}</span></div>${stepper('coins', d.coins)}</div>${manual(L('Other VP','Andere punten'))}</div>`;
    upd=()=>{ base(); const r=d.coins%3, m=3-r; $('#o-note').textContent= r? L(`${m} more coin${m>1?'s':''} for +1 VP`,`Nog ${m} munt${m>1?'en':''} voor +1 punt`):''; };
  } else if(k==='sci'){
    body=`${out}<div class="card">${['t','c','g','w'].map(s=>`<div class="field">${symIcon(s)}<div class="lbl"><b>${tx(SYM[s].pl)}</b>${s==='w'?`<span>${L('Scientists Guild, Babylon, etc.','Wetenschappersgilde, Babylon, enz.')}</span>`:''}</div>${stepper('sci.'+s, d.sci[s])}</div>`).join('')}</div>
      <div class="card"><b>${L('Next symbol worth','Volgend symbool waard')}</b><div class="advice" id="o-adv"></div><div class="small muted" id="o-wild" style="margin-top:8px"></div></div>`;
    upd=()=>{ base(); sciAdvice(d.sci,'#o-adv','#o-wild','#o-note'); };
  } else if(k==='mil'){
    const wt=warTokens(game)[pi], any=game.war.some(Boolean);
    body=`${out}<div class="card small">${any?`${L('From the War tab','Uit het tabblad Oorlog')}: <b>${wt.vp>=0?'+':''}${wt.vp} ${VPshort}</b> (${wt.p1}× +1, ${wt.p3}× +3, ${wt.p5}× +5, ${wt.m1}× −1)`:L('Tip: use the <b>War</b> tab at the end of each age and military is filled in automatically.','Tip: gebruik het tabblad <b>Oorlog</b> op het einde van elk tijdperk, dan wordt militair automatisch ingevuld.')}</div>
      <div class="card"><div class="small muted" style="margin-bottom:4px">${any?L('Extra tokens (not recorded in War tab)','Extra fiches (niet in het tabblad Oorlog)'):L('Military tokens','Militaire fiches')}</div>
      <div class="field"><div class="lbl"><b>${L('+1 tokens','+1-fiches')}</b><span>${L('Age I victories','Overwinningen tijdperk I')}</span></div>${stepper('mil.p1', d.mil.p1)}</div>
      <div class="field"><div class="lbl"><b>${L('+3 tokens','+3-fiches')}</b><span>${L('Age II victories','Overwinningen tijdperk II')}</span></div>${stepper('mil.p3', d.mil.p3)}</div>
      <div class="field"><div class="lbl"><b>${L('+5 tokens','+5-fiches')}</b><span>${L('Age III victories','Overwinningen tijdperk III')}</span></div>${stepper('mil.p5', d.mil.p5)}</div>
      <div class="field"><div class="lbl"><b>${L('−1 tokens','−1-fiches')}</b><span>${L('Defeats','Nederlagen')}</span></div>${stepper('mil.m1', d.mil.m1)}</div></div>`;
    upd=base;
  } else if(k==='wonder'){
    if(p.wonder){
      const Wd=W(game.ed)[p.wonder], st=Wd[p.side];
      body=`${out}<div class="card"><div class="small muted">${tx(Wd.full)} · ${SIDE(game.ed,p.side)}</div>${st.map((s,i)=>`<label class="check"><input type="checkbox" data-stage="${i}" ${d.stages[i]?'checked':''}><div class="grow"><b>${L('Stage','Fase')} ${i+1}</b> <span class="small muted">${stageText(s)}</span></div><b>${s.vp?'+'+s.vp:''}</b></label>`).join('')}
      ${manual(L('Other wonder VP','Andere wonderpunten'),L('e.g. expansions','bv. uitbreidingen'))}</div>`;
    } else body=`${out}<div class="card">${manual(L('Wonder VP','Wonderpunten'),L('Sum of VP on your built stages','Som van de punten op je gebouwde fases'))}<p class="small muted">${L('Set this player’s wonder in <b>Players & wonders</b> to just tick off built stages.','Kies het wonder van deze speler bij <b>Spelers & wonders</b>, dan vink je gewoon de gebouwde fases aan.')}</p></div>`;
    upd=base;
  } else if(k==='guild'||k==='com'){
    const list=k==='guild'?GL(game.ed):CL(game.ed), key=k==='guild'?'guild':'com';
    body=`${out}<div class="card"><div class="small muted" style="margin-bottom:4px">${k==='guild'?L('For each guild you own, enter the count it scores on.','Vul voor elke gilde die je hebt het aantal in waarop ze scoort.'):L('Age III yellow cards that score VP. Enter the count for each card you own.','Gele kaarten uit tijdperk III die punten opleveren. Vul het aantal in voor elke kaart die je hebt.')}</div>
      ${list.map(x=>`<div class="field"><div class="lbl"><b>${tx(x.n)} <span style="display:inline;color:var(--muted);font-weight:400">${VP(x.m)} ${L('each','per stuk')}</span></b><span>${tx(x.of)}</span></div>${stepper(key+'.'+x.k, d[key][x.k])}</div>`).join('')}
      ${k==='guild'?`<div class="field"><div class="lbl"><b>${L('Scientists Guild','Wetenschappersgilde')}</b><span>${L('No VP itself: add +1 wild in Science.','Zelf geen punten: tel +1 joker bij Wetenschap.')}</span></div></div>`:''}
      ${manual(k==='guild'?L('Other guild VP','Andere gildepunten'):L('Other yellow-card VP','Andere punten van gele kaarten'), k==='guild'?L('Expansion guilds','Gilden uit uitbreidingen'):'')}</div>`;
    upd=base;
  } else {
    body=`${out}<div class="card">${manual(tx(c.n)+(k==='debt'?L(' tokens',' (fiches)'):' '+VPshort), tx(CAT_HINT[k]))}</div>`;
    upd=base;
  }
  const cats=activeCats(game).map(x=>x.k), ci=cats.indexOf(k), prev=cats[(ci-1+cats.length)%cats.length], nextP=(pi+1)%game.players.length;
  body+=`<div class="row"><button class="btn grow" data-nav="${pi}:${prev}">‹ ${tx(CATS.find(x=>x.k===prev).n)}</button><button class="btn grow" data-nav="${nextP}:${k}">${esc(game.players[nextP].name)} ›</button></div>`;
  openSheet(title, body, {obj:d, update:upd});
}

function setupSheet(edit){
  const draft = edit ? JSON.parse(JSON.stringify(game)) : {players:(roster.slice(0,4).length>=3?roster.slice(0,4):['','','']).map(n=>newPlayer(n)), exp:{leaders:false,cities:false}, ed:edition};
  const draw=()=>{
    const wopts=w=>`<option value="">${L('Wonder…','Wonder…')}</option>`+Object.entries(W(draft.ed)).map(([k,v])=>`<option value="${k}" ${w===k?'selected':''}>${v.n}</option>`).join('');
    $('#setup-body').innerHTML=`
      <div class="row" style="margin-bottom:10px"><div class="grow small muted">${draft.players.length} ${L('players · seating order, clockwise','spelers · zitvolgorde, met de klok mee')}</div>
        <button class="btn small" data-pc="-1" ${draft.players.length<=3?'disabled':''}>−</button><button class="btn small" data-pc="1" ${draft.players.length>=7?'disabled':''}>+</button></div>
      <div class="row" style="margin-bottom:10px"><span class="small muted grow">${L('Edition','Editie')}</span><div class="chips">${[2,1].map(e=>`<button class="chip" data-ed="${e}" aria-pressed="${ED(draft.ed)===e}">${ED_NAME(e)}</button>`).join('')}</div></div>
      ${draft.players.map((p,i)=>`<div class="card" style="padding:10px">
        <div class="row"><span class="muted small" style="width:16px">${i+1}</span><input type="text" list="roster" placeholder="${defaultName(i+1)}" value="${esc(p.name)}" data-pn="${i}" autocomplete="off">
        ${i>0?`<button class="icon-btn" data-up="${i}" aria-label="${L('Move up','Omhoog')}">▲</button>`:'<span style="width:30px"></span>'}</div>
        <div class="row" style="margin-top:6px;padding-left:24px"><select data-pw="${i}">${wopts(p.wonder)}</select>
        <div class="chips" style="flex:0 0 auto">${['A','B'].map(s=>`<button class="chip" data-ps="${i}:${s}" aria-pressed="${p.side===s}">${SIDE_SHORT(draft.ed,s)}</button>`).join('')}</div>
        </div></div>`).join('')}
      <button class="btn small" data-rand>🎲 ${L('Random wonders','Willekeurige wonders')}</button>
      <div class="sec-title">${L('Expansions','Uitbreidingen')}</div>
      <div class="chips"><button class="chip" data-exp="leaders" aria-pressed="${draft.exp.leaders}">${L('Leaders','Leaders')}</button><button class="chip" data-exp="cities" aria-pressed="${draft.exp.cities}">${L('Cities','Cities')}</button></div>
      <datalist id="roster">${roster.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <button class="btn primary block" style="margin-top:16px" data-start>${edit?L('Save','Bewaren'):L('Start game','Start spel')}</button>`;
  };
  openSheet(edit?L('Players & wonders','Spelers & wonders'):L('New game','Nieuw spel'), '<div id="setup-body"></div>', {obj:draft});
  draw();
  const body=$('#setup-body');
  body.oninput=e=>{ if(e.target.dataset.pn!=null) draft.players[+e.target.dataset.pn].name=e.target.value; };
  body.onchange=e=>{ if(e.target.dataset.pw!=null) draft.players[+e.target.dataset.pw].wonder=e.target.value; };
  body.onclick=e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.pc){ if(+t.dataset.pc>0) draft.players.push(newPlayer('')); else draft.players.pop(); draw(); }
    else if(t.dataset.ps){ const [i,s]=t.dataset.ps.split(':'); draft.players[+i].side=s; draw(); }
    else if(t.dataset.up){ const i=+t.dataset.up; [draft.players[i-1],draft.players[i]]=[draft.players[i],draft.players[i-1]]; draw(); }
    else if(t.dataset.ed){ draft.ed=+t.dataset.ed; draw(); }
    else if(t.dataset.exp){ draft.exp[t.dataset.exp]=!draft.exp[t.dataset.exp]; draw(); }
    else if(t.hasAttribute('data-rand')){ const ks=Object.keys(W(draft.ed)).sort(()=>Math.random()-.5); draft.players.forEach((p,i)=>{p.wonder=ks[i]; p.side=Math.random()<.5?'A':'B';}); draw(); }
    else if(t.hasAttribute('data-start')){
      draft.players.forEach((p,i)=>{ p.name=p.name.trim()||defaultName(i+1); });
      const used=draft.players.map(p=>p.wonder).filter(Boolean);
      if(new Set(used).size!==used.length){ toast(L('Each wonder can only be used once','Elk wonder kan maar één keer gekozen worden')); return; }
      roster=[...new Set([...draft.players.map(p=>p.name).filter(n=>!isDefaultName(n)), ...roster])].slice(0,20);
      edition=ED(draft.ed);
      if(edit){
        if(draft.players.length!==game.players.length) draft.war=[null,null,null];   // seating changed: war records no longer valid
        game=draft;
      } else { game=newGame([], draft.exp); game.players=draft.players; game.ed=edition; }
      closeSheet();
    }
  };
}

/* ============ SCIENCE ============ */
function sciAdvice(s, advSel, wildSel, noteSel){
  const cur=sciScore(s);
  const deltas=['t','c','g'].map(k=>({k, d:sciScore({...s,[k]:(+s[k]||0)+1}).vp-cur.vp}));
  const max=Math.max(...deltas.map(x=>x.d)), allEq=deltas.every(x=>x.d===max);
  $(advSel).innerHTML=deltas.map(x=>`<div class="${x.d===max&&!allEq?'best':''}">${symIcon(x.k)}<b>+${x.d}</b><span class="small muted">${tx(SYM[x.k].n)}</span></div>`).join('');
  const wildD=sciScore({...s,w:(+s.w||0)+1}).vp-cur.vp;
  const assigned=cur.add.map((n,i)=>n?`${n}× ${tx(SYM['tcg'[i]].n).toLowerCase()}`:'').filter(Boolean);
  $(wildSel).innerHTML=`${(+s.w||0)?`${L('Wilds best used as','Jokers het best gebruikt als')}: <b>${assigned.join(', ')}</b>. `:''}${L(`An extra wild would be worth <b>+${wildD}</b>.`,`Een extra joker is <b>+${wildD}</b> waard.`)} ${L('Sets complete','Volledige sets')}: <b>${Math.min(...cur.a)}</b>.`;
  if(noteSel) $(noteSel).textContent=`${cur.a.join(' / ')} → ${cur.a.map(x=>x*x).join('+')} + ${7*Math.min(...cur.a)}`;
}

/* ============ WAR ============ */
function renderWar(){
  const v=$('#v-war');
  if(!game){ v.innerHTML=`<div class="card empty"><h2 style="font-family:Georgia,serif">${L('No game in progress','Geen spel bezig')}</h2><p class="muted">${L('Military battles compare you with your two neighbors, so the tracker needs the seating order. Start a game first.','Veldslagen vergelijken je met je twee buren, dus de teller heeft de zitvolgorde nodig. Start eerst een spel.')}</p><button class="btn primary" data-act="new">${L('New game','Nieuw spel')}</button></div>${warExplainer()}`; return; }
  const n=game.players.length, age=warAge;
  if(!game.cur) game.cur=[null,null,null];
  if(!game.cur[age]) game.cur[age]= (game.war[age]||game.war[age-1]||game.cur[age-1]||game.players.map(()=>0)).slice();
  const sh=game.cur[age];
  const recorded=!!game.war[age] && game.war[age].every((x,i)=>x===sh[i]);
  const dir=[L('← Pass left','← Doorgeven naar links'),L('Pass right →','Doorgeven naar rechts →'),L('← Pass left','← Doorgeven naar links')][age];
  const ageWord=L('Age','Tijdperk');
  v.innerHTML=`
    <div class="chips" style="margin-bottom:12px">${[0,1,2].map(a=>`<button class="chip" data-age="${a}" aria-pressed="${a===age}">${ageWord} ${AGE[a]}${game.war[a]?' ✓':''}</button>`).join('')}</div>
    <div class="card small"><div class="row"><span class="age-badge a${age+1}">${ageWord.toUpperCase()} ${AGE[age]}</span><span class="grow">${L('Win','Winst')} <b>+${MIL_VP[age]}</b> · ${L('Lose','Verlies')} <b>−1</b> · ${L('Tie 0, vs each neighbor','Gelijk 0, tegen elke buur')}</span></div><div class="muted" style="margin-top:6px">${dir}</div></div>
    <div class="card" data-obj="war">
      <div class="small muted" style="margin-bottom:2px">${L('Total shields on each player’s red cards and wonder','Totaal aantal schilden op de rode kaarten en het wonder van elke speler')}</div>
      ${game.players.map((p,i)=>`<div class="war-row"><div class="grow"><b>${esc(p.name)}</b><div class="vs" id="vs-${i}"></div></div>${stepper(`cur.${age}.${i}`, sh[i])}</div>`).join('')}
    </div>
    <button class="btn ${recorded?'':'primary'} block" data-record></button>
    ${game.war[age]?`<button class="btn ghost small block" style="margin-top:6px" data-unrecord>${L('Undo this age','Dit tijdperk ongedaan maken')}</button>`:''}
    <div class="sec-title">${L('Running military total','Militaire tussenstand')}</div>
    <div class="card"><table class="mini"><tr><th>${L('Player','Speler')}</th><th>I</th><th>II</th><th>III</th><th>${VPshort}</th></tr>
      ${game.players.map((p,i)=>`<tr><td>${esc(p.name)}</td>${[0,1,2].map(a=>{ if(!game.war[a]) return '<td class="muted">–</td>'; const s=game.war[a]; let vp=0; neighbors(n,i).forEach(j=>{ if(s[i]>s[j]) vp+=MIL_VP[a]; else if(s[i]<s[j]) vp--; }); return `<td>${vp>0?'+':''}${vp}</td>`; }).join('')}<td><b>${warTokens(game)[i].vp}</b></td></tr>`).join('')}
    </table></div>
    ${warExplainer()}`;
  const wrap=v.querySelector('[data-obj]');
  wrap._upd=()=>{
    const s=game.cur[age];
    game.players.forEach((p,i)=>{
      $('#vs-'+i).innerHTML=neighbors(n,i).map(j=>{
        const r=s[i]>s[j]?'w':s[i]<s[j]?'l':'t';
        const lbl=r==='w'?'+'+MIL_VP[age]:r==='l'?'−1':'0';
        return `<span class="tok ${r}">${lbl} ${L('vs','tegen')} ${esc(game.players[j].name)}</span>`;
      }).join('');
    });
    const btn=v.querySelector('[data-record]'), rec=!!game.war[age]&&game.war[age].every((x,i)=>x===s[i]);
    btn.className='btn block '+(rec?'':'primary');
    btn.textContent=rec?L(`Age ${AGE[age]} recorded ✓`,`Tijdperk ${AGE[age]} genoteerd ✓`):(game.war[age]?L('Update recorded result','Genoteerd resultaat bijwerken'):L(`Record Age ${AGE[age]} battle`,`Veldslag tijdperk ${AGE[age]} noteren`));
  };
  wrap._upd();
}

  <p style="margin-top:0">${L('At the end of each age, compare your shields with <b>each</b> of your two neighbors. More shields: take a victory token (+1 in Age I, +3 in Age II, +5 in Age III). Fewer: take a −1 defeat token. Tie: nothing.','Vergelijk op het einde van elk tijdperk je schilden met <b>elk</b> van je twee buren. Meer schilden: neem een overwinningsfiche (+1 in tijdperk I, +3 in tijdperk II, +5 in tijdperk III). Minder: neem een nederlaagfiche (−1). Gelijk: niets.')}</p>

  const ag=e.target.closest('[data-age]');
  if(ag){ warAge=+ag.dataset.age; save(); renderWar(); return; }
  if(e.target.closest('[data-record]')){ game.war[warAge]=game.cur[warAge].slice(); save(); toast(L(`Age ${AGE[warAge]} recorded`,`Tijdperk ${AGE[warAge]} genoteerd`)); if(warAge<2){ warAge++; } renderAll(); return; }
  if(e.target.closest('[data-unrecord]')){ game.war[warAge]=null; save(); renderAll(); return; }
  if(e.target.closest('[data-act="new"]')) setupSheet();
});

/* ============ WONDERS ============ */
function edChips(){ return `<div class="grow small muted">${L('Edition','Editie')}</div><div class="chips">${[2,1].map(e=>`<button class="chip" data-edition="${e}" aria-pressed="${ED(edition)===e}">${ED_NAME(e)}</button>`).join('')}</div>`; }
document.addEventListener('click', e=>{ const b=e.target.closest('[data-edition]'); if(b){ edition=+b.dataset.edition; save(); renderAll(); } });
function renderWonders(){
  const v=$('#v-wonders');
  v.innerHTML=`<div class="row" style="margin-bottom:12px">${edChips()}</div>
    <div class="chips" style="margin-bottom:12px">${['A','B'].map(s=>`<button class="chip" data-side="${s}" aria-pressed="${wonderSide===s}">${ED(edition)===1?L('Side ','Kant ')+s:SIDE(edition,s)}</button>`).join('')}</div>
    ${Object.values(W(edition)).map(Wd=>{ const st=Wd[wonderSide]; const vp=st.reduce((a,s)=>a+s.vp,0); return `<div class="card wonder">
      <div class="row"><h3 class="grow">${Wd.n}</h3><span class="tag">${L('starts with','start met')} ${tx(RES[Wd.res])}</span><span class="tag">${VP(vp)}</span></div>
      <div class="small muted" style="margin-bottom:6px">${tx(Wd.full)}</div>
      ${st.map((s,i)=>`<div class="stage"><span class="n">${i+1}</span><span>${stageText(s)}</span></div>`).join('')}
      <ul class="small" style="padding-left:18px;margin:10px 0 0">${Wd.tips.map(t=>`<li>${tx(t)}</li>`).join('')}</ul></div>`; }).join('')}`;
}
$('#v-wonders').addEventListener('click', e=>{ const s=e.target.closest('[data-side]'); if(s){ wonderSide=s.dataset.side; renderWonders(); } });

/* ============ GUIDE ============ */
const GUIDE = [
 {t:['The game in 60 seconds','Het spel in 60 seconden'], open:true, h:[`
  <p>3–7 players each develop an ancient city over <b>3 Ages</b>. Each Age, everyone gets a hand of 7 cards. You <b>pick one card, play it, and pass the rest</b> (left in Ages I &amp; III, right in Age II). When 2 cards remain you play one, and the last one is discarded. Each player plays 6 cards per Age, 18 per game.</p>
  <p>After every Age, you fight a <b>military battle</b> with both neighbors. After Age III, <b>most victory points wins</b>. Ties go to the player with more coins.</p>`, `
  <p>3 tot 7 spelers bouwen elk een oude stad uit over <b>3 tijdperken</b>. Elk tijdperk krijgt iedereen 7 kaarten. Je <b>kiest één kaart, speelt ze en geeft de rest door</b> (naar links in tijdperk I en III, naar rechts in tijdperk II). Als er nog 2 kaarten over zijn, speel je er één en wordt de laatste afgelegd. Elke speler speelt 6 kaarten per tijdperk, 18 per spel.</p>

 {t:['Your turn: 3 options','Je beurt: 3 mogelijkheden'], h:[`<ul>

  <li><b>Build a wonder stage</b>: tuck the card face-down under your board and pay the stage’s cost. The card’s face doesn’t matter, so this is a great way to “bury” a card your neighbor wants.</li>

  <li><b>Een fase van je wereldwonder bouwen</b>: schuif de kaart gesloten onder je wonderbord en betaal de kosten van die fase. Wat er op de kaart staat maakt niet uit, dus zo “begraaf” je ook een kaart die je buur wil.</li>
  <li><b>Afleggen voor 3 munten</b>.</li></ul>
  <p>Je mag nooit twee identieke kaarten bouwen.</p>`]},
 {t:['Cards by color','Kaarten per kleur'], h:[`<ul>
  <li><b style="color:var(--wonder)">Brown</b>: raw resources (wood, stone, clay, ore). <b style="color:var(--muted)">Grey</b>: manufactured goods (glass, textile, papyrus).</li>
  <li><b style="color:var(--civ)">Blue</b>: straight victory points.</li>
  <li><b style="color:var(--com)">Yellow</b>: coins, cheaper trading, and (in Age III) VP.</li>
  <li><b style="color:var(--mil)">Red</b>: shields for military battles.</li>
  <li><b style="color:var(--sci)">Green</b>: science symbols (tablet, compass, gear).</li>
  <li><b style="color:var(--guild)">Purple</b> (Age III only): guilds that score off you and your neighbors.</li></ul>`, `<ul>
  <li><b style="color:var(--wonder)">Bruin</b>: grondstoffen (hout, steen, klei, erts). <b style="color:var(--muted)">Grijs</b>: fabricaten (glas, textiel, papyrus).</li>
  <li><b style="color:var(--civ)">Blauw</b>: rechtstreeks punten.</li>
  <li><b style="color:var(--com)">Geel</b>: munten, goedkoper handelen en (in tijdperk III) punten.</li>
  <li><b style="color:var(--mil)">Rood</b>: schilden voor veldslagen.</li>
  <li><b style="color:var(--sci)">Groen</b>: wetenschapssymbolen (tablet, passer, tandwiel).</li>
  <li><b style="color:var(--guild)">Paars</b> (alleen tijdperk III): gilden die punten geven voor jou en je buren.</li></ul>`]},
 {t:['Resources & trading','Grondstoffen & handel'], h:[`<ul>
  <li>Resources are <b>never spent</b>: each brown/grey card produces its resource once every turn.</li>
  <li>Missing something? Buy it from a <b>direct neighbor</b> for <b>2 coins each</b>, even if they’d rather you didn’t. They keep the coins, and their card stays theirs.</li>

  <li>Everyone starts with 3 coins.</li></ul>`, `<ul>

  <li>Mis je iets? Koop het bij een <b>directe buur</b> voor <b>2 munten per stuk</b>, ook als die dat liever niet heeft. De buur houdt de munten, en de kaart blijft van hem.</li>
  <li>Handelspost en Marktplaats (geel) verlagen dat tot 1 munt.</li>
  <li>Iedereen begint met 3 munten.</li></ul>`]},
 {t:['Scoring (7 categories)','Puntentelling (7 categorieën)'], h:[`<ul>
  <li><b style="color:var(--mil)">Military</b>: sum of victory/defeat tokens.</li>
  <li><b style="color:var(--coin)">Treasury</b>: 1 VP per 3 coins.</li>

  <li><b style="color:var(--civ)">Civilian</b>: VP on blue cards.</li>
  <li><b style="color:var(--com)">Commerce</b>: VP from Age III yellow cards.</li>
  <li><b style="color:var(--guild)">Guilds</b>: as printed on each guild.</li>
  <li><b style="color:var(--sci)">Science</b>: count² per symbol type + 7 per complete set of three.</li></ul>
  <p>The <b>Score</b> tab handles all of this. A typical winning score is in the 50s–70s.</p>`, `<ul>
  <li><b style="color:var(--mil)">Militair</b>: som van je overwinnings- en nederlaagfiches.</li>
  <li><b style="color:var(--coin)">Schatkist</b>: 1 punt per 3 munten.</li>
  <li><b style="color:var(--wonder)">Wereldwonder</b>: punten op je gebouwde fases.</li>
  <li><b style="color:var(--civ)">Burgerlijk</b>: punten op blauwe kaarten.</li>
  <li><b style="color:var(--com)">Handel</b>: punten van gele kaarten uit tijdperk III.</li>
  <li><b style="color:var(--guild)">Gilden</b>: zoals op elke gilde staat.</li>
  <li><b style="color:var(--sci)">Wetenschap</b>: aantal² per soort symbool + 7 per volledige set van drie.</li></ul>

 {t:['Winning strategy','Winnende strategie'], h:[`<ul>
  <li><b>Pick 1–2 engines</b> early and lean in: science, military, blue cards, wonder, or guilds. Don’t try to do everything.</li>
  <li><b>Watch your neighbors</b>, not the whole table. They’re who you trade with, fight, and pass cards to.</li>
  <li><b>Read the hand you pass.</b> With 3–4 cards left in Age III, ask what each card is worth to your neighbor. Burying a 10-point card under your wonder often beats taking a 4-point card yourself.</li>
  <li><b>Don’t build what you can buy.</b> If a neighbor has stone, paying 2 coins now and then is often cheaper than spending a whole turn on a stone card.</li>
  <li><b>Double-resource brown cards</b> (e.g. “stone/clay”) are among the best Age I picks.</li>
  <li><b>Chains are free turns.</b> An Age I card that makes two Age II/III cards free is worth more than its face value.</li>
  <li><b>The last pick each age</b>: with 2 cards left, the other one is discarded. Plan around it.</li>
  <li><b>Coins aren’t points.</b> 3 coins = 1 VP, so spend them, but keep a few for trading.</li></ul>`, `<ul>
  <li><b>Kies vroeg 1 of 2 sporen</b> en ga ervoor: wetenschap, militair, blauwe kaarten, je wonder of gilden. Probeer niet alles te doen.</li>
  <li><b>Let op je buren</b>, niet op de hele tafel. Met hen handel je, vecht je, en aan hen geef je kaarten door.</li>
  <li><b>Kijk wat je doorgeeft.</b> Met nog 3–4 kaarten in tijdperk III: wat is elke kaart waard voor je buur? Een kaart van 10 punten onder je wonder begraven is vaak beter dan zelf een kaart van 4 punten nemen.</li>
  <li><b>Bouw niet wat je kunt kopen.</b> Als je buur steen heeft, is af en toe 2 munten betalen vaak goedkoper dan een hele beurt aan een steenkaart besteden.</li>
  <li><b>Bruine kaarten met twee grondstoffen</b> (bv. “steen/klei”) zijn top in tijdperk I.</li>
  <li><b>Ketens zijn gratis beurten.</b> Een kaart uit tijdperk I die twee latere kaarten gratis maakt, is meer waard dan ze lijkt.</li>
  <li><b>De laatste keuze per tijdperk</b>: met 2 kaarten over wordt de andere afgelegd. Hou daar rekening mee.</li>
  <li><b>Munten zijn geen punten.</b> 3 munten = 1 punt, dus geef ze uit, maar hou er een paar over om te handelen.</li></ul>`]},
 {t:['Military, smartly','Slim militair spelen'], h:[`<ul>
  <li>Age III battles swing <b>6 VP per neighbor</b> (+5 vs −1). Count shields before the last two turns of each age.</li>
  <li>Winning by 1 shield is the same as winning by 10. Don’t overspend.</li>
  <li>If a neighbor goes heavily military, sometimes it’s cheaper to <b>concede</b> (−1) and spend those turns on points.</li>
  <li>In the 2010 edition, the Strategists Guild scores off neighbors’ defeat tokens.</li></ul>`, `<ul>
  <li>Veldslagen in tijdperk III maken een verschil van <b>6 punten per buur</b> (+5 tegenover −1). Tel de schilden vóór de laatste twee beurten van elk tijdperk.</li>
  <li>Winnen met 1 schild is evenveel waard als winnen met 10. Investeer niet te veel.</li>

  <li>In de editie van 2010 scoort het Strategengilde op de nederlaagfiches van je buren.</li></ul>`]},
 {t:['Science, smartly','Slim wetenschap spelen'], h:[`<ul>
  <li>Science explodes late: the 3rd tablet is worth +5, the 4th +7, the 5th +9.</li>
  <li>It’s strongest when <b>neither neighbor</b> is also going science. Two scientists side by side starve each other.</li>
  <li>Green cards chain heavily (Age I → II → III). Starting early makes later ones free.</li>
  <li>Watch for neighbors feeding you green cards, and <b>deny green to a runaway scientist</b> by burying it.</li>
  <li>Use the <b>Science</b> tab to see which symbol is worth most right now.</li></ul>`, `<ul>
  <li>Wetenschap ontploft laat in het spel: de 3e tablet is +5 waard, de 4e +7, de 5e +9.</li>
  <li>Het werkt het best als <b>geen van je buren</b> ook voor wetenschap gaat. Twee wetenschappers naast elkaar hongeren elkaar uit.</li>
  <li>Groene kaarten vormen veel ketens (tijdperk I → II → III). Vroeg beginnen maakt latere kaarten gratis.</li>
  <li>Let op buren die je groene kaarten toespelen, en <b>houd groen weg bij een wegloper</b> door het te begraven.</li>
  <li>Gebruik het tabblad <b>Wetenschap</b> om te zien welk symbool nu het meest waard is.</li></ul>`]},
 {t:['Age-by-age plan','Plan per tijdperk'], h:[`<ul>
  <li><span class="age-badge a1">I</span> Build economy: resources (especially doubles), a Trading Post if neighbors are resource-rich, and chain starters. Grab a cheap red card if neighbors don’t.</li>
  <li><span class="age-badge a2">II</span> Grey goods if you lack them, mid-size blue and green cards, more chains. Build wonder stages when hands are weak.</li>
  <li><span class="age-badge a3">III</span> Points only. Guilds, big blue cards, finish the wonder, win the military battle, and hate-draft what would win the game for someone else.</li></ul>`, `<ul>
  <li><span class="age-badge a1">I</span> Bouw je economie: grondstoffen (vooral dubbele), een Handelspost als je buren veel grondstoffen hebben, en kaarten die ketens starten. Neem een goedkope rode kaart als je buren dat niet doen.</li>
  <li><span class="age-badge a2">II</span> Grijze grondstoffen als je ze mist, middelgrote blauwe en groene kaarten, meer ketens. Bouw wonderfases als je hand zwak is.</li>
  <li><span class="age-badge a3">III</span> Enkel nog punten. Gilden, grote blauwe kaarten, je wonder afwerken, de veldslag winnen, en kaarten wegnemen die iemand anders de overwinning zouden geven.</li></ul>`]},
 {t:['Free-build chains','Ketens (gratis bouwen)'], h:()=>chainsHtml(edition)},
 {t:['Common beginner mistakes','Veelgemaakte beginnersfouten'], h:[`<ul>

  <li>Vergeten dat buren jouw grondstoffen kunnen kopen (dat is inkomen voor jou!).</li>

// Chain card names: [English, Dutch]
const C = {
  well:['Well','Bron'], baths:['Baths','Badhuis'], altar:['Altar','Altaar'], theater:['Theater','Theater'],
  market:['Marketplace','Marktplaats'], posts:['East / West Trading Post','Handelspost Oost / West'],
  apoth:['Apothecary','Apotheek'], workshop:['Workshop','Werkplaats'], script:['Scriptorium','Scriptorium'],
  statue:['Statue','Beeld'], aqueduct:['Aqueduct','Aquaduct'], temple:['Temple','Tempel'], carav:['Caravansery','Karavanserai'], forum:['Forum','Forum'],
  stables:['Stables','Stallen'], dispensary:['Dispensary','Hospitaal'], archery:['Archery Range','Schietbaan'], lab:['Laboratory','Laboratorium'],
  court:['Courthouse','Rechtszaal'], library:['Library','Bibliotheek'], school:['School','School'], walls:['Walls','Muren'], training:['Training Ground','Trainingsplaats'],
  pantheon:['Pantheon','Pantheon'], gardens:['Gardens','Tuinen'], haven:['Haven','Haven'], lighthouse:['Lighthouse','Vuurtoren'], arena:['Arena','Arena'], lodge:['Lodge','Herberg'],
  siege:['Siege Workshop','Legerwerkplaats'], observ:['Observatory','Observatorium'], senate:['Senate','Senaat'], univ:['University','Universiteit'], academy:['Academy','Academie'], study:['Study','College'],
  fort:['Fortifications','Vestingwerk'], circus:['Circus','Circus'],
};
function chainsHtml(e){
  const nm = ks => ks.map(k=>tx(C[k])).join(', ');
  const tbl=(head,rows)=>`<table class="mini" style="margin-top:10px"><tr><th>${head[0]}</th><th>${head[1]}</th></tr>${rows.map(([a,b])=>`<tr><td>${nm(a)}</td><td>${nm(b)}</td></tr>`).join('')}</table>`;
  const A=L('Age','Tijdperk');
  const intro=`<p class="small muted" style="margin:0">${L('Owning the left card lets you build the right one for free. Showing the','Wie de linkse kaart heeft, bouwt de rechtse gratis. Je ziet de editie')} <b>${ED_NAME(e)}</b>${L(' edition. Switch it at the top of this page.','. Wissel bovenaan deze pagina.')}${ED(e)===2?L(' On 2020 cards the link is shown as a symbol in the corner.',' Op de kaarten van 2020 staat de keten als symbool in de hoek.'):''}</p>`;
  if(ED(e)===1) return intro
    +tbl([`${A} I`,`→ ${A} II`],[[['baths'],['aqueduct']],[['altar'],['temple']],[['theater'],['statue']],[['posts'],['forum']],[['market'],['carav']],[['apoth'],['stables','dispensary']],[['workshop'],['archery','lab']],[['script'],['court','library']]])
    +tbl([`${A} II`,`→ ${A} III`],[[['temple'],['pantheon']],[['statue'],['gardens']],[['forum'],['haven']],[['carav'],['lighthouse']],[['walls'],['fort']],[['training'],['circus']],[['dispensary'],['lodge','arena']],[['lab'],['observ','siege']],[['library'],['senate','univ']],[['school'],['academy','study']]]);
  return intro
    +tbl([`${A} I`,`→ ${A} II`],[[['well'],['statue']],[['baths'],['aqueduct']],[['posts'],['forum']],[['market'],['carav']],[['apoth'],['stables','dispensary']],[['workshop'],['archery','lab']],[['script'],['court','library']]])
    +tbl([`${A} I`,`→ ${A} III ${L('(skips an age)','(slaat een tijdperk over)')}`],[[['altar'],['pantheon']],[['theater'],['gardens']]])
    +tbl([`${A} II`,`→ ${A} III`],[[['forum'],['haven']],[['carav'],['lighthouse']],[['walls'],['fort']],[['training'],['circus']],[['dispensary'],['lodge','arena']],[['lab'],['observ','siege']],[['library'],['senate','univ']],[['school'],['academy','study']]]);
}
function renderGuide(){
  $('#v-guide').innerHTML=`<div class="row" style="margin-bottom:12px">${edChips()}</div>`+GUIDE.map(g=>`<details ${g.open?'open':''}><summary>${tx(g.t)}</summary><div class="body">${typeof g.h==='function'?g.h():tx(g.h)}</div></details>`).join('')+
  `<p class="small muted" style="text-align:center">${L('An unofficial fan companion. 7 Wonders is a game by Antoine Bauza, published by Repos Production.','Een onofficiële hulp-app door fans. 7 Wonders is een spel van Antoine Bauza, uitgegeven door Repos Production.')}</p>`;
}

/* ============ NAV / INIT ============ */
const TABS={score:renderScore, sci:renderSci, war:renderWar, wonders:renderWonders, guide:renderGuide};
const TAB_NAME={score:['Score','Score'], sci:['Science','Wetenschap'], war:['War','Oorlog'], wonders:['Wonders','Wonders'], guide:['Guide','Gids']};
const SUB={score:['Score pad','Scoreblok'], sci:['Science optimizer','Wetenschapshulp'], war:['Military tracker','Veldslagteller'], wonders:['Wonder boards','Wonderborden'], guide:['Rules & strategy','Regels & strategie']};
let tab=LS.get('tab','score'); if(!TABS[tab]) tab='score';
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('#tabs [data-tab] span').forEach(s=>s.textContent=tx(TAB_NAME[s.parentNode.dataset.tab]));
  $('#langBtn').textContent=lang==='nl'?'EN':'NL';
  $('#langBtn').setAttribute('aria-label', L('Switch to Dutch','Overschakelen naar Engels'));
  $('#themeBtn').setAttribute('aria-label', L('Toggle theme','Thema wisselen'));
  $('#subtitle').textContent=tx(SUB[tab]);
}
function show(t){
  tab=t; LS.set('tab',t);
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+t));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===t?'page':'false'));
  $('#subtitle').textContent=tx(SUB[t]);
  TABS[t](); window.scrollTo(0,0);
}
function renderAll(){ TABS[tab](); }
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(b) show(b.dataset.tab); });
$('#langBtn').onclick=()=>{ lang=lang==='nl'?'en':'nl'; LS.set('lang',lang); applyLang(); renderAll(); };
// Theme
const applyTheme=t=>{ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; };
let theme=LS.get('theme',null); applyTheme(theme);
$('#themeBtn').onclick=()=>{ const cur=theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); theme=cur==='dark'?'light':'dark'; LS.set('theme',theme); applyTheme(theme); };
if(!theme && matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light');
applyLang();
show(tab);
// Keep the screen on during a game, where supported
async function wake(){ try{ if(game && 'wakeLock' in navigator && document.visibilityState==='visible') await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', wake); wake();
// PWA
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
